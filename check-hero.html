<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="dong-bo.js"></script>
<script src="so-luong.js"></script>
<script src="nvl-core.js"></script>
<script src="khung.js"></script>
<script src="don.js"></script>

<!-- CR-02 (23/11/2026): màn này chỉ nhận số Tồn kho / Cần đặt SIXMEN đã tính, lưu thành phiên bản KHOÁ (server /api/can-dat).
     Phần phân tích cũ (Đặt gấp / Gom đơn / Nhận định / Đề xuất) giữ nguyên code ở phan-tich-cu.html để chuyển sang Lập kế hoạch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cập nhật dữ liệu Cần đặt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ux.css">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1f2328; --ink2:#3d4450; --muted:#6b7280; --faint:#9aa1ab; --line:#e5e7eb; --hover:#f2f4f6; --head:#fafbfc;
  --brand:#16794a; --brand-bg:#e7f4ec; --brand-dk:#11603b; --accent:#1f5fae; --accent-bg:#eaf1fb;
  --crit:#c62828; --crit-bg:#fdecea; --warn:#a85d00; --warn-bg:#fff3df; --ok:#16794a; --ok-bg:#e7f4ec;
  --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--font)}
[hidden]{display:none!important}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center}
.brand b{display:block;font-size:13px;font-weight:800;letter-spacing:.03em;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--brand);font-weight:600}
.nav{display:grid;gap:1px}
.nav-label{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.07em;text-transform:uppercase;padding:14px 8px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink2);text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav a.active{background:var(--brand);color:#fff;font-weight:600}
.nav a svg{width:16px;height:16px;flex:none}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:11px;color:var(--faint)}
.col{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 28px;display:flex;align-items:center;gap:12px;min-height:52px}
.topbar .tt{flex:1;min-width:0}
.topbar .tt b{display:block;font-size:14.5px;font-weight:700}
.topbar .tt small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;width:40px;height:40px;font-size:16px;cursor:pointer}
.content{padding:24px 32px 56px;display:grid;gap:16px;max-width:1500px}

/* nút / ô nhập: thẻ thật, cao ≥ 40px */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dk)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--brand);text-decoration:underline;min-height:40px;padding:0 6px;font-weight:600}
.btn:focus-visible,.fld:focus-visible,.paste:focus-visible,.seg button:focus-visible,.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fld{min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;width:100%}
label.lb{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:16px 18px}
.scroll{overflow-x:auto}

/* đầu trang */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.crumb{font-size:12px;color:var(--muted)}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:2px 0 6px}
.head p{margin:0;color:var(--ink2);font-size:13px;max-width:760px}
.cur{min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:2px;font-size:12px}
.cur .l{color:var(--muted)} .cur b{font-size:15px} .cur .w{color:var(--warn);font-weight:600}
/* thanh bước */
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:6px 16px 6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink2);font:inherit;font-size:13px;font-weight:500;cursor:default}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--hover);color:var(--muted)}
.step.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.step.on i{background:#fff;color:var(--brand)}
.step.done{background:var(--brand-bg);border-color:#cfe6d8;color:var(--brand);font-weight:600;cursor:pointer}
.step.done i{background:var(--brand);color:#fff}
/* bộ chọn */
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.pick .lb{min-width:200px}
.pick .own{font-size:12px;color:var(--muted);padding-bottom:10px}
.pick .sp{margin-left:auto}
/* 2 khung nhập */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.inbox{display:grid;gap:10px;padding:16px 18px}
.inbox .hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.inbox .hd h2{font-size:15px;font-weight:700;margin-right:auto}
.paste{display:block;width:100%;min-height:64px;resize:none;border:1.5px dashed #a9cdb6;background:#f7fbf8;border-radius:8px;padding:20px 14px;font:inherit;font-size:13px;color:var(--ink2);text-align:center;cursor:text;caret-color:transparent}
.paste::placeholder{color:var(--ink2)}
.paste.got{border-style:solid;border-color:#cfe6d8;background:var(--brand-bg)}
.paste.err{border-color:#f0b4ae;background:var(--crit-bg)}
.badges{display:flex;flex-wrap:wrap;gap:6px;min-height:24px}
.bd{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--ok-bg);color:var(--ok)}
.bd.w{background:var(--warn-bg);color:var(--warn)} .bd.x{background:var(--crit-bg);color:var(--crit)} .bd.g{background:var(--hover);color:var(--muted)} .bd.b{background:var(--accent-bg);color:var(--accent)}
.msg{font-size:12px;color:var(--crit)} .msg.ok{color:var(--muted)}
/* xem trước */
.pv-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 18px 10px}
.pv-hd h2{font-size:15px;font-weight:700}
.pv-hd .muted{display:block;font-size:12px;font-weight:400}
.seg{margin-left:auto;display:inline-flex;background:var(--hover);border-radius:9px;padding:3px;gap:2px}
.seg button{min-height:40px;border:0;background:transparent;border-radius:7px;padding:0 14px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--ink2);background:var(--head)}
th:first-child,td:first-child{text-align:left}
td.c{font-weight:700}
td.e{color:var(--faint)}
td.e::after{content:"·"}
tr.tot td{background:var(--brand-bg);font-weight:700}
td.bad{background:var(--crit-bg);color:var(--crit)}
td.neg{color:var(--crit)}
td .tx{display:block;font-size:11px;font-weight:400;color:var(--warn)}
/* thanh dưới */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 18px}
.foot .t{margin-right:auto;font-size:13px;color:var(--ink2)}
/* bước 2 */
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.ck{padding:14px 16px;display:grid;gap:4px;align-content:start}
.ck .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.ck .t i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;flex:none}
.ck.ok .t i{background:var(--ok)} .ck.w .t i{background:var(--warn)} .ck.x .t i{background:var(--crit)} .ck.b .t i{background:var(--accent)}
.ck .d{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.ck .d li{margin:2px 0}
.ck .d ul{margin:2px 0 0;padding-left:18px}
.chg td.up{color:var(--warn);font-weight:700} .chg td.dn{color:var(--accent);font-weight:700}
.ref{background:var(--accent-bg);border:1px solid #cfdcf0;border-radius:10px;padding:12px 16px;font-size:13px;color:var(--ink2)}
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;padding:16px 18px}
.cb{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-height:40px;font-size:13px;cursor:pointer}
.cb input{width:20px;height:20px;accent-color:var(--brand)}
.err-box{background:var(--crit-bg);color:var(--crit);border-radius:8px;padding:10px 14px;font-size:13px}
/* bước 3 */
.okb{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--brand-bg);border:1px solid #cfe6d8;border-radius:10px;padding:16px 18px}
.okb .ic{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.okb .tx{margin-right:auto;display:grid;gap:2px} .okb b{font-size:15px;color:var(--brand-dk)} .okb span{font-size:12.5px;color:var(--ink2)}
.vt td,.vt th{text-align:left} .vt td.r,.vt th.r{text-align:right}
.vt td:first-child{white-space:normal;min-width:110px;max-width:230px} .vt td:last-child{text-align:right}
.chg td:nth-child(2),.chg th:nth-child(2){text-align:left}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted)}
.pill.on{background:var(--ok-bg);color:var(--ok)}
/* hộp xem / so sánh */
.dlg{position:fixed;inset:0;z-index:60;background:rgba(15,20,18,.35);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.dlg>div{background:var(--surface);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.25);width:100%;max-width:1000px;display:grid;gap:12px;padding:18px 20px}
.dlg h3{font-size:16px}
.dlg .row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ro{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:40;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
  body.nav-open .side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30}
  .menu-btn{display:inline-block}
  .topbar{padding:9px 16px}
  .content{padding:18px 16px 40px}
  .head{grid-template-columns:1fr}
  .pick .sp{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">S</span><div><b>SIXMEN</b><small>Planning v5.4</small></div></div>
    <nav class="nav" aria-label="Điều hướng"></nav>
    <div class="side-foot"></div>
  </aside>
  <div class="col">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button>
      <div class="tt"><b>Phân tích nhu cầu</b><small>Cập nhật dữ liệu Cần đặt → kiểm tra → lưu phiên bản khoá</small></div>
    </header>
    <main class="content" id="main"></main>
  </div>
</div>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = Khung.esc;
const fmt = v => v == null ? "" : Number(v).toLocaleString("vi-VN");
const fmtDay = v => v == null ? "" : String(v).replace(".", ",");
const pad = x => String(x).padStart(2, "0");
const THU = ["CN","T2","T3","T4","T5","T6","T7"];
const dt = t => { if (!t) return "—"; const d = new Date(t); return `${THU[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dtS = t => { if (!t) return "—"; const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const sixTxt = s => { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? esc(s) : dt(d.getTime()); };
const nowLocal = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const KIND = {ton:"Tồn kho", need:"Cần đặt", days:"Ngày còn bán"};

/* ===== Mã / màu / size theo danh mục ===== */
const models = () => Khung.models().filter(m => Khung.visible(m.key) && Khung.match(m.name, m.code, Khung.aliasOf(m)));
const modelOf = k => Khung.models(true).find(m => m.key === k);
const sizesOf = k => Khung.sizesOf(k);
const isPoloSz = k => { const s = sizesOf(k); return s.length === 5 && s.join() === Khung.POLO_SZ.join(); };
/* Nhãn size hiển thị theo SIXMEN (áo: 2X / 3X), không đổi tên khác */
const sizeLabels = k => isPoloSz(k) ? ["M","L","XL","2X","3X"] : sizesOf(k);
const nSz = k => sizesOf(k).length;
const colorsOf = k => Khung.colorsOfModel(k);
const cname = (c, k) => Khung.colorName(c, k) || (Don.COLOR_NAME || {})[c] || c;
const normSz = s => { let t = String(s || "").toUpperCase().replace(/\s+/g, "").replace(/^SIZE/, ""); if (t === "XXL") t = "2XL"; if (t === "XXXL") t = "3XL"; if (/^[23]X$/.test(t)) t += "L"; return t; };
const szIdx = (lab, k) => sizesOf(k).map(normSz).indexOf(normSz(lab));
const nrm = s => Khung.norm(String(s || "")).toUpperCase().replace(/[^A-Z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
/* Tên dòng → mã màu SIXMEN (TRG, XDE…). Mã đúng → nhận luôn; bảng ghi tên màu (quần, sơ mi) → đổi về mã theo danh mục. Không đoán → báo màu lạ */
function colorCode(lab, k){
  const t = nrm(lab); if (!t) return null;
  const C = colorsOf(k);
  if (C.includes(t.replace(/ /g, ""))) return t.replace(/ /g, "");
  const L = C.map(c => ({c, nm:nrm(cname(c, k))})).sort((a, b) => b.nm.length - a.nm.length);
  for (const x of L) if (x.nm && x.nm === t) return x.c;
  for (const x of L) if (x.nm && t.endsWith(" " + x.nm)) return x.c;
  for (const x of L) if (x.nm && (" " + t + " ").includes(" " + x.nm + " ")) return x.c;
  return null;
}

/* ===== Đọc bảng dán / Excel (dựa trên cách đọc bảng của bản cũ) =====
   Mỗi ô: số nguyên đầu tiên = số lượng (giữ dấu âm, bỏ dấu ngăn nghìn); "35.2d" = ngày còn bán; "+26%", nhãn chữ bị bỏ qua.
   Ô trống = trống (null), khác 0. Không làm tròn, không tự thêm màu / size. */
const isIntTok = s => /^-?\d+$/.test(s) || /^-?\d{1,3}([.,]\d{3})+$/.test(s);
const toInt = s => Number(s.replace(/[.,]/g, ""));
const dayTok = s => { const m = /^(\d+(?:[.,]\d+)?)d$/i.exec(s); return m ? Number(m[1].replace(",", ".")) : null; };
function cellVal(raw){
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return {v:null, d:null, txt:null};
  const tk = s.split(/\s+/); let v = null, d = null;
  for (const x of tk){ if (v === null && isIntTok(x)) v = toInt(x); else if (d === null && dayTok(x) !== null) d = dayTok(x); }
  return {v, d, txt: v === null ? s : null};
}
function rowsFromHTML(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  return [...doc.querySelectorAll("tr")].map(tr => [...tr.children].map(td => (td.textContent || "").replace(/\s+/g, " ").trim()));
}
const rowsFromText = txt => txt.replace(/\r/g, "").replace(/\n+$/, "").split("\n").map(l => l.split("\t").map(x => x.trim()));
const isHead = c => /^mau\b|^size$/.test(Khung.norm(String(c || "")).trim());   // "Màu \ Size", "Màu/Size" (bỏ dấu trước khi so)
const isTot = c => /^t[ổoô]ng\b|^total\b|^sum\b/i.test(Khung.norm(String(c || "")).trim()) || /^t[ổo]ng/i.test(String(c || "").trim());
/* Tách bảng: dòng tiêu đề có 2 ô "Màu \ Size" → 2 bảng cạnh nhau (trái = Tồn kho, phải = Cần đặt, như bản cũ) */
function splitTables(rows){
  const hi = rows.findIndex(r => r.some(isHead));
  if (hi < 0) return [{rows, start:0, end:Infinity, hi:-1}];
  const starts = rows[hi].map((c, i) => isHead(c) ? i : -1).filter(i => i >= 0);
  return starts.map((s, j) => ({rows, start:s, end: j + 1 < starts.length ? starts[j + 1] : Infinity, hi}));
}
function parseTable(seg, k){
  const out = {grid:{}, days:{}, order:[], tot:{rows:{}, cols:[], all:null}, labels:null, unkColors:[], unkSizes:[], dup:[], review:[], raw:[], hasHead: seg.hi >= 0};
  const N = nSz(k), cut = r => r.slice(seg.start, seg.end === Infinity ? undefined : seg.end);
  let colIdx = null, totCol = null;
  if (seg.hi >= 0){
    const h = cut(seg.rows[seg.hi]); colIdx = []; out.labels = [];
    h.forEach((c, j) => { if (j === 0) return; const t = String(c || "").trim(); if (!t) return;
      if (isTot(t)){ if (totCol === null) totCol = j; return; }
      const si = szIdx(t, k);
      if (si >= 0 && si < N){ colIdx[si] = j; out.labels[si] = t; }
      else if (/^[0-9A-Z]{1,5}$/i.test(t.replace(/\s/g, ""))) out.unkSizes.push(t); });
  }
  seg.rows.forEach((r0, ri) => {
    if (ri === seg.hi) { out.raw.push(cut(r0)); return; }
    const r = cut(r0); const lab = String(r[0] || "").trim();
    const body = r.slice(1);
    if (!lab && body.every(x => !String(x || "").trim())) return;
    out.raw.push(r);
    const get = i => colIdx ? (colIdx[i] != null ? r[colIdx[i]] : "") : r[1 + i];
    const getT = () => colIdx ? (totCol != null ? r[totCol] : "") : r[1 + N];
    if (isTot(lab)){
      for (let i = 0; i < N; i++){ out.tot.cols[i] = cellVal(get(i)).v; }
      out.tot.all = cellVal(getT()).v; return;
    }
    const c = colorCode(lab, k);
    const anyNum = body.some(x => cellVal(x).v !== null || dayTok(String(x || "").trim()) !== null);
    if (!c){ if (anyNum && lab && !isHead(lab)) out.unkColors.push(lab); return; }   // dòng chữ không có số (tiêu đề "Đang tồn"…) bỏ qua; dòng có số mà màu lạ → báo, không bỏ qua

  const L = VERS || [];
  return header("Lịch sử phiên bản dữ liệu", "", m && m.name) + (s ? stepper() : "") +
    (s ? `<div class="okb" role="status"><span class="ic">✓</span><div class="tx"><b>Đã lưu và khoá phiên bản V${s.n}</b><span>Số SIXMEN lúc ${esc(sixTxt(s.sixmenAt))} · lưu ${esc(dt(s.at))} · ${esc(Khung.userName(s.by))} · Tồn ${fmt(s.totTon)} · Cần đặt ${fmt(s.totNeed)}</span></div><a class="btn primary" href="ke-hoach.html?m=${encodeURIComponent(KEY)}">Sang Lập kế hoạch →</a></div>` : "") +
    `<section class="panel" aria-label="Các phiên bản"><div class="pv-hd"><h2>Các phiên bản · ${esc(m ? m.name : "")}<span class="muted">Phiên bản đã lưu không sửa được. Muốn điều chỉnh, tạo phiên bản mới ở Bước 1.</span></h2>
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${s ? "" : `<button type="button" class="btn" data-go="1">← Về cập nhật dữ liệu</button>`}${canSave() ? `<button type="button" class="btn" data-go="new">+ Cập nhật phiên bản mới</button>` : ""}</span></div>
      ${VERS == null ? `<div class="pad muted">Đang tải…</div>` : !L.length ? `<div class="pad muted">Mã này chưa có phiên bản nào.</div>` : `<div class="scroll"><table class="vt"><thead><tr><th>Phiên bản</th><th>Giờ lấy số SIXMEN</th><th>Lưu lúc · Người lưu</th><th class="r">Tổng Tồn</th><th class="r">Tổng Cần đặt</th><th class="r">Ô thay đổi</th><th>Trạng thái</th><th></th></tr></thead><tbody>${L.map(v => `<tr><td><b>V${v.n}</b>${v.legacy ? '<div class="small muted">dữ liệu trước khi khoá</div>' : ""}${v.note ? `<div class="small muted">${esc(v.note)}</div>` : ""}</td><td>${esc(sixTxt(v.sixmenAt))}</td><td>${esc(dtS(v.at))} · ${esc(Khung.userName(v.by))}</td><td class="r num">${fmt(v.totTon)}</td><td class="r num"><b>${fmt(v.totNeed)}</b></td><td class="r num">${v.changed == null ? "—" : fmt(v.changed)}</td><td><span class="pill${v.current ? " on" : ""}">${v.current ? "Đang dùng" : "Đã thay thế"}</span></td><td style="text-align:right"><button type="button" class="btn link" data-view="${v.n}">Xem</button><button type="button" class="btn link" data-cmp="${v.n}"${L.length < 2 ? " disabled" : ""}>So sánh</button></td></tr>`).join("")}</tbody></table></div>`}</section>`;
}
function render(){
  const el = $("#main");
  if (!KEY){ el.innerHTML = `<div class="panel pad muted">${esc(Khung.emptyText())}</div>`; return; }
  const keep = document.activeElement && document.activeElement.id;
  el.innerHTML = STEP === 1 ? renderStep1() : STEP === 2 ? renderStep2() : renderStep3();
  if (keep && document.getElementById(keep) && keep !== "cOk") try { document.getElementById(keep).focus(); } catch(e){}
}

/* ===== Nhận bảng ===== */
function accept(kind, rows, src){
  const d = draft(), k = KEY, segs = parseRows(rows, k);
  d.msg = d.msg || {};
  if (!segs.length){ d.msg[kind] = "Không đọc được bảng: cần có dòng màu (TRG, XDE… hoặc tên màu) và các cột size. Bôi đen từ ô Màu \\ Size tới ô Tổng cuối rồi dán lại."; render(); return; }
  if (segs.length >= 2 && src !== "xls"){ d.ton = segs[0]; d.need = segs[1]; d.msg.ton = ""; d.msg.need = "Đã nhận 2 bảng cạnh nhau: bảng trái → Tồn kho, bảng phải → Cần đặt."; TAB = "need"; }
  else { d[kind] = segs[0]; d.msg[kind] = ""; TAB = kind; }
  if (!segs[0].hasHead) (d.msg[kind] = (d.msg[kind] ? d.msg[kind] + " " : "") + "Bảng không có dòng tiêu đề size: đọc theo thứ tự cột " + sizeLabels(k).join(", ") + ", cột kế tiếp là Tổng.");
  ERR = ""; d.confirm = false; render();
}
document.addEventListener("paste", e => {
  const t = e.target.closest && e.target.closest("[data-paste]"); if (!t) return;
  e.preventDefault(); if (!canSave()) return;
  const cd = e.clipboardData, html = cd.getData("text/html"), txt = cd.getData("text") || "";
  let rows = /<t[rd][\s>]/i.test(html) ? rowsFromHTML(html) : [];
  if (!rows.length) rows = rowsFromText(txt);
  accept(t.dataset.paste, rows, "paste");
});
document.addEventListener("keydown", e => { const t = e.target.closest && e.target.closest("[data-paste]"); if (t && !(e.ctrlKey || e.metaKey) && e.key.length === 1) e.preventDefault(); });   // khung chỉ để dán, không gõ tay
let XLSX_P = null;
const loadXlsx = () => XLSX_P || (XLSX_P = new Promise((ok, no) => { if (window.XLSX) return ok(); const s = document.createElement("script"); s.src = "lib/xlsx.full.min.js"; s.onload = () => ok(); s.onerror = () => { XLSX_P = null; no(new Error("Không tải được thư viện đọc Excel")); }; document.head.appendChild(s); }));
function pickFile(kind){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".xlsx,.xls,.csv";
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; const d = draft();
    try { await loadXlsx(); const wb = XLSX.read(await f.arrayBuffer(), {type:"array"}); const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""}).map(r => r.map(x => String(x).trim()));
      accept(kind, rows, "xls"); } catch(err){ d.msg[kind] = "Không đọc được file Excel: " + (err.message || err); render(); } };
  inp.click();
}
async function template(kind){
  try { await loadXlsx(); } catch(e){ alert(e.message); return; }
  const k = KEY, lab = sizeLabels(k), C = colorsOf(k);
  const aoa = [["Màu \\ Size"].concat(lab, ["Tổng"])].concat(C.map(c => [c].concat(lab.map(() => ""), [""])), [["Tổng"].concat(lab.map(() => ""), [""])]);
  const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, KIND[kind]);
  XLSX.writeFile(wb, `mau-${kind === "ton" ? "ton-kho" : "can-dat"}-${k}.xlsx`);
}

/* ===== Lưu phiên bản ===== */
async function save(){
  const d = draft(), k = KEY; if (BUSY) return;
  BUSY = true; ERR = ""; render();
  const N = nSz(k), pack = t => { const o = {}; t.order.forEach(c => o[c] = t.grid[c].slice(0, 5)); return o; };
  const days = {}; if (hasDays(d.ton)) d.ton.order.forEach(c => { if (d.ton.days[c].some(v => v != null)) days[c] = d.ton.days[c].slice(0, 5); });
  const tot = t => ({rows:t.tot.rows, cols:t.tot.cols.slice(0, N), all:t.tot.all});
  const body = {ton:pack(d.ton), need:pack(d.need), days, tot:{ton:tot(d.ton), need:tot(d.need)}, sizes:{ton:d.ton.labels, need:d.need.labels},
    raw:{ton:d.ton.raw, need:d.need.raw}, sixmenAt:d.sixmenAt || "", note:d.note || "", confirm:!!d.confirm, base: CURV ? CURV.n : null};
  try {
    const r = await fetch("/api/can-dat/" + encodeURIComponent(k), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ BUSY = false; ERR = j.error || ("Không lưu được (mã lỗi " + r.status + ")."); if (r.status === 409) await loadVers(); render(); return; }
    try { if (j.value && window.DongBo) DongBo.take("checkhero-v3", j.value, j.rev); } catch(e){}
    await loadVers();
    const v = (VERS || []).find(x => x.n === j.n) || {n:j.n};
    LAST_SAVED = Object.assign({key:k}, v);
    DRAFT[k] = null; BUSY = false; STEP = 3; render(); window.scrollTo(0, 0);
  } catch(e){ BUSY = false; ERR = "Mất kết nối server, chưa lưu. Thử lại."; render(); }
}

/* ===== Xem / so sánh phiên bản ===== */
const verCache = {};
async function getVer(k, n){ const id = k + "|" + n; if (verCache[id]) return verCache[id]; const r = await fetch(`/api/can-dat/${encodeURIComponent(k)}/${n}`); if (!r.ok) throw new Error("Không đọc được V" + n); return verCache[id] = await r.json(); }
const asTable = (v, kind) => { const g = v[kind] || {}, C = colorsOf(KEY), order = Object.keys(g).sort((a, b) => C.indexOf(a) - C.indexOf(b));
  const tt = v.tot && v.tot[kind] ? v.tot[kind] : {rows:{}, cols:[], all:null};
  const lab = v.sizes && v.sizes[kind] ? v.sizes[kind] : (Array.isArray(v.sizes) ? v.sizes : null);
  return {order, grid:kind === "days" ? {} : g, days:kind === "days" ? g : {}, tot:kind === "days" ? null : tt, labels:lab || sizeLabels(KEY)}; };
function dlg(html){ const w = document.createElement("div"); w.className = "dlg"; w.innerHTML = `<div role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(w);
  const close = () => w.remove(); w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-x]")) close(); }); w.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  setTimeout(() => { const b = w.querySelector("[data-x]"); if (b) b.focus(); }, 0); return w; }
async function view(n){
  let v; try { v = await getVer(KEY, n); } catch(e){ alert(e.message); return; }
  const kinds = ["ton", "need"].concat(v.days && Object.keys(v.days).length ? ["days"] : []);
  const w = dlg(`<div style="display:flex;gap:10px;align-items:start"><div style="flex:1"><h3>V${v.n} · ${esc((modelOf(KEY) || {}).name || KEY)}${v.legacy ? " · dữ liệu trước khi khoá" : ""}</h3><div class="small muted">Số SIXMEN lúc ${esc(sixTxt(v.sixmenAt))} · lưu ${esc(dt(v.at))} · ${esc(Khung.userName(v.by))}${v.note ? " · " + esc(v.note) : ""} · đã khoá, không sửa được</div></div><button type="button" class="btn" data-x>Đóng</button></div>
    <div class="seg" role="group" aria-label="Bảng" style="margin-left:0;justify-self:start">${kinds.map((k, i) => `<button type="button" data-vk="${k}" aria-pressed="${i === 1}">${KIND[k]}</button>`).join("")}</div><div data-vt></div>
    ${v.raw ? `<details><summary class="small" style="cursor:pointer;min-height:40px;display:flex;align-items:center">Số liệu gốc đã dán</summary><div class="scroll"><table>${["ton","need"].map(k => (v.raw[k] || []).length ? `<tr><th colspan="8" style="text-align:left">${KIND[k]}</th></tr>` + v.raw[k].map(r => `<tr>${(r || []).map(c => `<td style="text-align:left">${esc(c)}</td>`).join("")}</tr>`).join("") : "").join("")}</table></div></details>` : ""}`);
  const draw = k => { w.querySelector("[data-vt]").innerHTML = gridTable(asTable(v, k), k, KEY, {calc: !v.tot}); w.querySelectorAll("[data-vk]").forEach(b => b.setAttribute("aria-pressed", b.dataset.vk === k)); };
  w.addEventListener("click", e => { const b = e.target.closest("[data-vk]"); if (b) draw(b.dataset.vk); }); draw("need");
}
async function compare(n){
  const L = VERS || [], i = L.findIndex(x => x.n === n), other = (L[i + 1] || L[i - 1] || {}).n;
  let a = Math.min(n, other), b = Math.max(n, other);
  const opts = sel => L.map(x => `<option value="${x.n}"${x.n === sel ? " selected" : ""}>V${x.n} · ${esc(dtS(x.at))}${x.current ? " (đang dùng)" : ""}</option>`).join("");
  const w = dlg(`<div style="display:flex;gap:10px;align-items:start"><h3 style="flex:1">So sánh 2 phiên bản · ${esc((modelOf(KEY) || {}).name || KEY)}</h3><button type="button" class="btn" data-x>Đóng</button></div>
    <div class="row"><label class="lb">Bản A<select class="fld" data-ca>${opts(a)}</select></label><label class="lb">Bản B<select class="fld" data-cb>${opts(b)}</select></label></div><div data-cr class="muted">Đang tải…</div>`);
  const draw = async () => { const x = +w.querySelector("[data-ca]").value, y = +w.querySelector("[data-cb]").value; const out = w.querySelector("[data-cr]");
    try { const [va, vb] = await Promise.all([getVer(KEY, x), getVer(KEY, y)]); const D = diffCells(va, vb, KEY);
      out.className = ""; out.innerHTML = `<div class="small muted" style="margin-bottom:6px">${D.length} ô khác nhau (Tồn kho + Cần đặt)</div>` + diffTable(D, KEY, "V" + x, "V" + y); } catch(e){ out.textContent = e.message; } };
  w.addEventListener("change", e => { if (e.target.matches("[data-ca],[data-cb]")) draw(); }); draw();
}

/* ===== Sự kiện ===== */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"), st = e.target.closest(".step.done[data-step]");
  if (st && +st.dataset.step === 1 && STEP === 2){ STEP = 1; ERR = ""; render(); return; }
  if (g){ const v = g.dataset.go;
    if (v === "2"){ const d = draft(); if (!(d.ton && d.need)) return; STEP = 2; ERR = ""; render(); window.scrollTo(0, 0); }
    else if (v === "1"){ STEP = 1; ERR = ""; render(); }
    else if (v === "hist"){ STEP = 3; LAST_SAVED = null; render(); }
    else if (v === "new"){ STEP = 1; LAST_SAVED = null; DRAFT[KEY] = null; render(); }
    return; }
  const tb = e.target.closest("[data-tab]"); if (tb){ TAB = tb.dataset.tab; render(); return; }
  const cl = e.target.closest("[data-clear]"); if (cl){ const d = draft(); d[cl.dataset.clear] = null; d.msg[cl.dataset.clear] = ""; d.confirm = false; render(); return; }
  const x = e.target.closest("[data-xls]"); if (x){ pickFile(x.dataset.xls); return; }
  const tp = e.target.closest("[data-tpl]"); if (tp){ template(tp.dataset.tpl); return; }
  if (e.target.closest("[data-save]")){ save(); return; }
  const vw = e.target.closest("[data-view]"); if (vw){ view(+vw.dataset.view); return; }
  const cp = e.target.closest("[data-cmp]"); if (cp){ compare(+cp.dataset.cmp); return; }
});
document.addEventListener("change", async e => {
  if (e.target.id === "pModel"){ KEY = e.target.value; try { localStorage.setItem("_ui_cd_key", KEY); } catch(err){} STEP = 1; ERR = ""; LAST_SAVED = null; render(); await loadVers(); render(); return; }
  if (e.target.id === "pSix" || e.target.id === "cSix"){ draft().sixmenAt = e.target.value; return; }
  if (e.target.id === "cOk"){ draft().confirm = e.target.checked; render(); return; }
});
document.addEventListener("input", e => { if (e.target.id === "cNote") draft().note = e.target.value; if (e.target.id === "pSix" || e.target.id === "cSix") draft().sixmenAt = e.target.value; });
Khung.onFilter(async () => { const k = pickKey(); if (k !== KEY){ KEY = k; STEP = 1; LAST_SAVED = null; ERR = ""; render(); await loadVers(); } render(); });
$("#menuBtn").addEventListener("click", e => { e.stopPropagation(); document.body.classList.toggle("nav-open"); });
document.addEventListener("click", e => { if (document.body.classList.contains("nav-open") && !e.target.closest(".side")) document.body.classList.remove("nav-open"); });

KEY = pickKey(); render();
loadVers().then(render);
})();
</script>
</body>
</html>
