<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="dong-bo.js"></script>
<script src="so-luong.js"></script>
<script src="nvl-core.js"></script>
<script src="khung.js"></script>
<script src="don.js"></script>
<script src="canh-bao.js"></script>
<script src="mau-gui.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi tiết đơn · SIXMEN Planning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="khung.css">
<link rel="stylesheet" href="ux.css">
<style>
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.head h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.kv .field{padding:3px 7px;width:100%;max-width:220px}
.kv>div{min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.tl{display:grid;grid-template-columns:120px 130px minmax(0,1fr);gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.tl:last-child{border-bottom:none} .tl .w{color:var(--muted)} .tl b.u{font-weight:600}
.next{display:grid;gap:2px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.next:last-child{border-bottom:none} .next.due b{color:var(--crit)}
.call{display:grid;grid-template-columns:96px minmax(0,1fr) 110px minmax(0,1.3fr);gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.call:last-child{border-bottom:none}
.recv{padding:12px 14px;display:grid;gap:10px}
.recv table td,.recv table th{text-align:center;padding:4px 6px} .recv table td:first-child,.recv table th:first-child{text-align:left}
.recv input.q{width:62px;text-align:right}
.rl{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px} .rl.void{color:var(--muted);text-decoration:line-through}
table.nvlt{min-width:1240px} table.nvlt td:first-child,table.nvlt td:nth-child(2){white-space:nowrap} table.nvlt td{vertical-align:top}
.ro{background:var(--warn-bg);color:var(--warn);border-radius:7px;padding:8px 12px;font-size:12.5px}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:700px){.tl,.call{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><span class="logo">S</span><div><b>SIXMEN</b><small>Planning sản xuất</small></div></div><nav class="nav" aria-label="Điều hướng"></nav><div class="side-foot"></div></aside>
  <div class="col">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button><div class="tt"><b><a href="theo-doi.html" style="color:var(--muted);text-decoration:none;font-weight:500">Đơn sản xuất ›</a> <span id="crumb"></span></b><small id="crumbSub"></small></div></header>
    <div class="content" id="main"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), esc=Khung.esc, fmt=Don.fmt, dm=Don.dm, SZ=Khung.live(()=>{ const f=find(); return Khung.sizesOf(f&&f.m&&f.m.key); });   // 09/11/2026: size theo mã của đơn (quần: 29–34)
const CNM=c=>{ const f=find(); return Khung.colorName(c,f&&f.m&&f.m.key)||Don.COLOR_NAME[c]||""; };   // 13/11: tên màu riêng của mã (Jeans XDA = Xanh Đậm)
const OID=new URLSearchParams(location.search).get("id");
let tab=(location.hash||"#san-xuat").slice(1), recvOpen=false, draft=null, SRV=[], chotOpen=false, chotSnap=null, chotTxt={reason:"", note:""};
if(tab==="nhan-hang") tab="san-xuat";   // link cũ
const dmy=s=>s?s.split("-").reverse().join("/"):"—";
function find(){ const S=Don.readS(); SoLuong.mark(S); for(const k of Object.keys(S.models||{})){ const p=S.models[k]; for(const o of [...(p.orders||[]),...(p.gapOrders||[])]) if(o.id===OID) return {S,o,p,m:Don.modelOf(k)}; } return null; }
const nvlItems=()=>{ try { return (JSON.parse(localStorage.getItem("nvl-v3"))||{}).items||[]; } catch(e){ return []; } };
const readN=()=>{ try { return JSON.parse(localStorage.getItem("nvl-v3"))||{items:[]}; } catch(e){ return {items:[]}; } };
const fmt1=x=>(Math.round((+x||0)*100)/100).toLocaleString("vi-VN");
const isKho=()=>Khung.me&&Khung.me.role==="kho";
const AL_KIND={"giu":"Giữ","nha":"Nhả","cap":"Cấp khi xuất","hoan":"Trả lại (huỷ phiếu)","khoi-tao":"Chuyển phần giữ cũ"};
const LIST_ST={"nhap":"Nháp","da-gui":"Đã gửi NCC","ncc-xac-nhan":"NCC xác nhận","nhan-mot-phan":"Nhận một phần","da-nhan":"Đã nhận đủ","huy":"Đã huỷ"};
/* Phiếu xuất là gốc: chép tổng đã xuất vào đơn (o.ship / nvlOut) cho các phần cũ dùng */
function syncShip(o,N){
  const L=NV.issuesOf(N,o);
  if(!L.length){ if(o.shipPx){ o.ship=null; o.nvlOut=false; o.shipDate=null; delete o.shipPx; } return; }
  const sum={}; L.forEach(p=>(p.lines||[]).forEach(l=>{ sum[l.item]=(sum[l.item]||0)+(+l.qty||0)+(+l.fromX||0); }));
  o.ship=sum; o.nvlOut=true; o.shipPx=L.map(p=>p.no); o.shipDate=L[0].date||Don.today(); o.shipBy=L[0].by; o.noDeduct=false;
}
/* Giữ / nhả / xuất / huỷ phiếu qua server (sổ phân bổ), rồi cập nhật đơn */
async function nvlAct(m, body){
  const r=await NV.op(Object.assign({oid:OID, model:m.key}, body));
  if(r.status!==200){ if(window.DongBo) DongBo.fresh("nvl-v3"); alert((r.j&&r.j.error)||"Không thực hiện được"); render(); return false; }
  const N=readN(); Don.mutate(OID,o=>{ const before=JSON.stringify([o.ship,o.nvlOut,o.shipPx]); syncShip(o,N); if(JSON.stringify([o.ship,o.nvlOut,o.shipPx])===before) return false; });
  render(); return true;
}
const CHECK=gc=>[...(gc?[["vai","Vải"],["bo","Bo"],["mavach","Mã vạch"],["nhan","Nhãn sườn"],["phieu","Biên bản giao nhận NVL đã ký"]]:[]),["erp","Đã lên đơn trên ERP"],["g_anh","Zalo: ảnh bảng đơn"],["g_file","Zalo: file thiết kế / thêu"],["g_note","Zalo: ghi chú màu"],["g_hinh","Zalo: hình áo mẫu"]];
function render(){
  const f=find();
  if(!f){ $("#main").innerHTML=`<div class="panel empty">Không tìm thấy đơn này. <a href="theo-doi.html">Về danh sách đơn sản xuất</a></div>`; $("#crumb").textContent="Không tìm thấy"; return; }
  const {S,o,m}=f, X=Don.xOf(o), st=Don.statusOf(o,S), r=SoLuong.receiptInfo(o,S.perRoll||65), canP=Khung.canEdit(m.key), can=Don.canAct(o,m.key), stage=Don.stage(o);   // V5: can = được làm phần thực thi (người phụ trách mã, Admin, người thực thi đơn); canP = phần kế hoạch
  const gc=!o.type&&X.type==="GC", hasRecv=SoLuong.validReceipts(o).length>0, ph=Don.phase(o), C=gc?Don.nvlOf(o,S,m.key):null;
  document.title=`${Don.label(o,m)} · Chi tiết đơn`;
  $("#crumb").textContent=Don.label(o,m); $("#crumbSub").textContent=`${m.name} · ${X.name} (${Don.typeLabel(o)})${o.flow===3?(Don.poTxt(o)?" · "+Don.poTxt(o):""):o.erpCode?" · ERP "+o.erpCode:""}`;
  const acts=[], v3=o.flow===3, qOk=Don.qlvhOk(o);
  /* V5.3: đơn đã bàn giao chờ tiếp nhận → Tiếp nhận / Trả lại (người được bàn giao; Admin hỗ trợ không đổi người thực thi). Chốt chưa bàn giao / bị trả lại → bàn giao ở Kế hoạch */
  if(ph==="cho-nhan"&&(Don.isMyExec(o)||Khung.isAdmin())) acts.push(`<button class="btn primary" data-exack title="Xác nhận đã nhận việc thực hiện đơn này">✓ Tiếp nhận</button><button class="btn" data-extra title="Trả lại người quản lý kế hoạch, bắt buộc ghi lý do">Trả lại…</button>`);
  if((ph==="chua-bg"||ph==="tra-lai")&&canP) acts.push(`<a class="btn primary" href="ke-hoach.html?m=${m.key}&bg=${encodeURIComponent(o.id)}#b4" title="Bàn giao ở Kế hoạch › Kiểm tra & Chốt">${ph==="tra-lai"?"Xử lý & bàn giao lại →":"Bàn giao ở Kế hoạch →"}</a>`);
  if(o.closed&&!o.cancelled&&window.MauGui) acts.push(`<button class="btn" data-maugui title="Xem trước mẫu gửi xưởng · sao chép ảnh dán Zalo · tải PNG / PDF">Mẫu gửi xưởng</button>`);   // V5.2
  /* V3: sau khi QLVH đã duyệt → gửi xưởng (gia công / FOB ở Kế hoạch; thêu / phôi bấm ở đây) → xưởng xác nhận nhận đơn → xưởng bắt đầu (2 mốc riêng) */
  if(can&&v3&&qOk&&stage==="run"&&!hasRecv){
    if(!o.sentAt&&o.type) acts.push(`<button class="btn primary" data-gapsend title="Đã gửi đơn (ảnh phiếu) cho xưởng qua Zalo">✓ Đã gửi đơn cho xưởng</button>`);
    if(!o.sentAt&&!o.type) acts.push(`<a class="btn primary" href="${Don.guiHref(o,m.key)}" title="Màn hình gửi xưởng: xuất NVL, tick việc gửi xưởng, bấm Gửi xưởng">Gửi xưởng →</a>`);
    if(o.sentAt&&!o.ackAt) acts.push(`<button class="btn primary" data-ack title="Ghi ngày xưởng xác nhận đã nhận đơn">✓ Xưởng xác nhận nhận đơn</button>`);
    if(o.ackAt&&!o.startedAt&&!o.type) acts.push(`<button class="btn primary" data-start title="Ghi ngày xưởng báo bắt đầu may thực tế; mốc gọi xưởng tính từ ngày này">✓ Xưởng đã bắt đầu</button>`);
  }
  if(can&&stage==="run"&&qOk&&ph!=="da-chot"&&ph!=="cho-trien-khai") acts.push(`<button class="btn ok" data-recv title="Ghi số xưởng giao thực tế theo màu × size. Chỉ cập nhật tiến độ trong Planning, không cộng vào tồn SIXMEN">📦 Ghi nhận xưởng giao</button>`);
  if(can&&stage==="run"&&hasRecv) acts.push(`<button class="btn${r.full?" primary":""}" data-chot title="Xác nhận kết thúc giao hàng với xưởng: giao đủ, hoặc giao thiếu (không nhận tiếp phần còn lại)">🔒 Chốt giao nhận</button>`);
  if(can&&o.arrived&&hasRecv&&!o.doneAt&&!o.cancelled) acts.push(`<button class="btn ghost" data-chot-reopen title="VD xưởng giao bổ sung sau khi đã chốt">Mở lại giao nhận</button>`);
  if(can&&ph==="giao-du"&&Don.canFinish(o)) acts.push(`<button class="btn primary" data-tab="chung-tu" title="Ghi nhận bàn giao hồ sơ ở tab Chứng từ & Bàn giao">✓ Bàn giao hồ sơ →</button>`);
  if(ph==="giao-du"&&Don.handState(o)==="cho") acts.push(`<button class="btn${o.handover.toUser===ME()||(!o.handover.toUser&&Khung.isAdmin())?" primary":""}" data-tab="chung-tu">${Don.HAND.cho} →</button>`);
  if(can&&ph==="da-chot") acts.push(`<a class="btn primary" href="${Don.guiHref(o,m.key)}" title="Màn hình gửi xưởng: xuất NVL, tick việc gửi xưởng, bấm Gửi xưởng">Gửi xưởng →</a>`);
  if(can&&ph==="cho-trien-khai") acts.push(`<button class="btn primary" data-start title="Ghi ngày xưởng báo bắt đầu may thực tế; mốc gọi xưởng tính từ ngày này">✓ Xưởng đã bắt đầu</button>`);
  if(canP&&stage==="pending") acts.push(`<a class="btn primary" href="ke-hoach.html?m=${m.key}">Mở ở Kế hoạch →</a>`);
  if(canP&&stage==="run"&&!hasRecv&&!o.qlvh) acts.push(`<button class="btn" data-reopen title="Đưa đơn về Kế hoạch để sửa">Mở lại kế hoạch</button>`);
  if(canP&&(o.closed||o.type)&&!o.nvlOut&&!o.cancelled&&!hasRecv) acts.push(`<button class="btn ghost" data-cancel>Huỷ đơn</button>`);
  if(canP&&o.cancelled) acts.push(`<button class="btn" data-uncancel>Khôi phục đơn</button>`);
  /* UX-2: chỉ 1 nút chính (xanh dương) ở đầu trang = việc của bước hiện tại; các nút khác giữ nguyên chức năng, chỉ đổi kiểu */
  { const sp=Don.steps(o,S), ck=sp&&sp.cur?sp.cur.k:null;
    const isPri=a=>ck==="sx"?(v3&&!o.ackAt&&!hasRecv?/\sdata-ack[\s>]/.test(a):!o.startedAt&&!o.type&&!hasRecv&&(v3||o.flow===2)?/\sdata-start[\s>]/.test(a):/\sdata-recv[\s>]/.test(a))
      :ck==="tn"?/data-exack|&bg=/.test(a)
      :ck==="giao"?/\sdata-chot[\s>]/.test(a):ck==="gui"?(/\sdata-gapsend[\s>]/.test(a)||/[?&]gui=/.test(a)):ck==="bg"?/data-tab="chung-tu"/.test(a):/Mở ở Kế hoạch|data-start|#b4"/.test(a)&&!ck;
    for(let i=0;i<acts.length;i++){ acts[i]=isPri(acts[i])?acts[i].replace(/class="btn( ok| primary)?"/,'class="btn primary"'):acts[i].replace(/class="btn (ok|primary)"/,'class="btn"'); } }
  const lock=SoLuong.locked(o)||o.closed?`<span class="pill p-ok">🔒 ${o.nvlOut?"Đã xuất NVL":"Số lượng đã khóa"}</span>`:"";
  /* bảng size: đặt / đã nhận / còn thiếu / dư. Thiếu, dư tính theo từng ô màu × size (size dư không bù size thiếu),
     nên cột Còn thiếu từng dòng cộng lại đúng bằng ô tổng; Đặt − Đã nhận = Còn thiếu − Dư */
  const Z=[0,0,0,0,0], sum=a=>a.reduce((x,y)=>x+y,0);
  const rows=Object.keys(r.short).filter(c=>(r.ordered[c]||Z).some(v=>v)||(r.received[c]||Z).some(v=>v));
  const lines=o.lines&&!o.lines.some(l=>Array.isArray(l.q))?o.lines:null, anyOver=r.overQty>0;   // đơn quần (nhập thẳng số) không có cột cây vải
  const sizeTbl=`<div class="scroll"><table class="t navy" id="sizeTbl"><thead><tr><th>Màu</th>${lines?"<th class='r'>Cây</th>":""}${SZ.map(s=>`<th class="r">${s}</th>`).join("")}<th class="r">Tổng đặt</th><th class="r">Đã nhận</th><th class="r">Còn thiếu</th>${anyOver?`<th class="r" title="Nhận nhiều hơn số đặt ở size đó">Giao dư</th>`:""}</tr></thead><tbody>
    ${rows.map(c=>{ const ord=r.ordered[c]||Z, got=r.received[c]||Z, sh=r.short[c], ov=r.over[c], cay=lines?lines.filter(l=>l.color===c).reduce((a,l)=>a+Don.n(+l.cay),0):null;
      return `<tr data-color="${c}"><td><b>${c}</b> <span class="muted">${CNM(c)||""}</span></td>${lines?`<td class="r num">${cay}</td>`:""}${ord.map((v,i)=>`<td class="r num">${v}${got[i]?`<div class="small" style="color:var(--ok)">về ${got[i]}</div>`:""}${hasRecv&&sh[i]?`<div class="small" style="color:var(--crit)">thiếu ${sh[i]}</div>`:""}${ov[i]?`<div class="small" style="color:var(--warn)">dư ${ov[i]}</div>`:""}</td>`).join("")}<td class="r num"><b>${fmt(sum(ord))}</b></td><td class="r num">${fmt(sum(got))}</td><td class="r num" data-k="thieu">${sum(sh)?`<b style="color:var(--crit)">${fmt(sum(sh))}</b>`:"0"}</td>${anyOver?`<td class="r num" data-k="du">${sum(ov)?fmt(sum(ov)):"0"}</td>`:""}</tr>`; }).join("")}
    <tr data-color="tong"><td><b>Tổng</b></td>${lines?`<td class="r num">${lines.reduce((a,l)=>a+Don.n(+l.cay),0)}</td>`:""}${SZ.map((_,i)=>`<td class="r num">${rows.reduce((a,c)=>a+(r.ordered[c]||Z)[i],0)}</td>`).join("")}<td class="r num"><b>${fmt(r.total)}</b></td><td class="r num"><b>${fmt(r.got)}</b></td><td class="r num" data-k="thieu"><b>${fmt(r.left)}</b></td>${anyOver?`<td class="r num" data-k="du"><b>${fmt(r.overQty)}</b></td>`:""}</tr></tbody></table></div>
    ${anyOver?`<div class="muted small" style="padding:6px 14px">Đặt ${fmt(r.total)} − đã nhận ${fmt(r.got)} = ${fmt(r.total-r.got)} = còn thiếu ${fmt(r.left)} − giao dư ${fmt(r.overQty)}. Size giao dư không bù cho size còn thiếu.</div>`:""}`;
  const nt=Don.nextTask(o,S,m.key), ms=Don.milestones(o,Don.cfgOf(S));
  const nexts=[]; if(nt) nexts.push({...nt, main:true});
  ms.filter(x=>stage==="run"&&!o.arrived&&!((o.calls||{})[x.date]||{}).done&&(!nt||x.date!==nt.date)).forEach(   /* UX-2: đã chốt giao nhận thì không hiện mốc gọi cũ */x=>nexts.push({date:x.date,label:x.label}));
  if(stage==="run"&&o.dueDate&&(!nt||nt.date!==o.dueDate)) nexts.push({date:o.dueDate,label:"Nhận hàng · nhập số về theo màu × size"});
  $("#main").innerHTML=`
    <div class="head"><h1>${esc(Don.label(o,m))}</h1><span class="pill ${Don.PHASE_PILL[ph]}" title="Trạng thái thực hiện">${Don.PHASE[ph]}</span>${(ph==="dang-sx"||ph==="giao-mot-phan"||ph==="giao-du")&&st.text!==Don.PHASE[ph]?`<span class="pill ${st.cls}">${esc(st.text)}</span>`:""}
      ${C&&!o.arrived&&!o.doneAt?`<span class="pill ${NV.STATE_PILL[C.state]}" title="Trạng thái đáp ứng NVL">NVL: ${NV.STATE[C.state]}</span>`:""}${C&&!o.arrived&&!o.doneAt&&C.risk&&C.risk.length?`<span class="pill ${C.risk.some(x=>x.lv==="crit")?"p-bad":"p-warn"}" title="${esc(C.risk.map(x=>x.t).join("\n"))}">Nguy cơ trễ</span>`:""}${lock}${can?"":`<span class="pill p-mute">Chỉ xem · ${esc(Khung.userName(m.owner))} phụ trách</span>`}<div class="acts">${acts.join("")}</div></div>
    ${(()=>{ const sp=Don.steps(o,S); if(!sp) return "";   /* UX-1: tiến trình 8 bước (chỉ hiển thị, lấy từ các mốc đã lưu) */
      return `<div class="panel" id="steps" style="padding:12px 14px;display:grid;gap:8px"><div class="steps">${sp.list.map(z=>`<div class="st ${z.cls}">${esc(z.t)}</div>`).join("")}</div>
        <div class="small">${sp.cur?`<b style="color:${sp.tone==="x"?"var(--crit)":sp.tone==="w"?"var(--warn)":"var(--accent)"}">Bước hiện tại: ${esc(sp.cur.t)}</b> · ${esc(sp.detail)}`:`<b style="color:var(--ok)">✓ Đã xong mọi bước · Hoàn tất Planning</b>`}</div></div>`; })()}
    ${alertBox(o,S,m)}
    ${o.cancelled?`<div class="ro">Đơn đã huỷ ${Don.hm(o.cancelled.at)} bởi ${esc(Khung.userName(o.cancelled.by))} · lý do: ${esc(o.cancelled.reason)}. Đơn không còn trừ vào Cần đặt.</div>`:""}
    <div class="split"><div style="display:grid;gap:16px;min-width:0">
      <div class="panel kv">
        <div><span class="k">Mã sản phẩm</span>${esc(m.code||"—")} · ${esc(m.name)}</div>
        <div><span class="k">Quản lý kế hoạch</span>${esc(Khung.userName(m.owner))} <span class="muted small">(phụ trách mã)</span></div>

  (o.cancelLog||[]).forEach(c=>{ E.push({t:c.at, by:c.by, txt:`Huỷ đơn · ${esc(c.reason)}`, raw:true}); E.push({t:c.restoredAt, by:c.restoredBy, txt:"Khôi phục đơn", raw:true}); });
  if(o.cancelled) E.push({t:o.cancelled.at, by:o.cancelled.by, txt:`Huỷ đơn · ${esc(o.cancelled.reason)}`, raw:true});
  Object.entries(o.calls||{}).forEach(([d,c])=>{ if(c.done) E.push({t:Date.parse((c.at||d)+"T09:00:00"), w:c.at||d, by:c.by, txt:`Đã gọi xưởng (mốc ${dm(d)})${c.note?" · "+esc(c.note):""}`, raw:true}); });

    (o.handoverLog||[]).forEach(e=>E.push({t:e.at, by:e.by, raw:true, txt:`${esc(HA[e.act]||e.act)}${e.to?" cho "+esc(e.to):""}${e.evidence?" · bằng chứng: "+esc(e.evidence):""}${e.reason?" · lý do: "+esc(e.reason):""}`})); }
  (o.ctuLog||[]).forEach(e=>{ if(e.act!=="sua"||e.f==="status") E.push({t:e.at, by:e.by, raw:true, txt:`Chứng từ ${esc((Don.CTU.find(c=>c.k===e.t)||{}).t||e.t)}: ${e.act==="them"?"thêm":e.act==="xoa"?"xoá":e.act==="na"?"không áp dụng":e.act==="bo-na"?"bỏ không áp dụng":"trạng thái → "+esc(Don.CT_ST[e.to]||e.to)}${e.reason?" · lý do: "+esc(e.reason):""}`}); });
  const SKIP=/(receipts|recvClose|recvLog|arrived|cancelled|cancelLog|sizeLog|calls|closed|closedBy|nvlOut|shipDate|shipBy|ship|noDeduct|adjust|reopenLog|sentAt|sentBy|startedAt|startedBy|sendOverride|chotOverride|flow|handover|doneAt|doneBy|qlvh|qlvhLog|ackAt|ackBy)/;
  const G={}; SRV.filter(e=>e.key!=="he-thong"&&!SKIP.test(e.path||"")).forEach(e=>{ const k=e.at+"|"+e.by; (G[k]=G[k]||{t:e.at, by:e.by, items:[]}).items.push(e); });
  Object.values(G).forEach(g=>E.push({t:g.t, by:g.by, raw:true, txt:g.items.map(e=>`${esc(Don.logLabel(e))}: <span class="muted" style="text-decoration:line-through">${esc(Don.logVal(e.before))}</span> → <b>${esc(Don.logVal(e.after))}</b>`).join("<br>")}));
  E.sort((a,b)=>b.t-a.t);
  return E.length?E.map(e=>`<div class="tl"><span class="w">${e.w?dmy(e.w):Don.hm(e.t)}</span><b class="u">${esc(who(e.by))}</b><span>${e.raw?e.txt:esc(e.txt)}</span></div>`).join("")
    +`<div class="tl"><span class="w"></span><span></span><span class="muted small">Từ nay mọi lần sửa đều ghi tên người làm. Các thao tác trước khi có tài khoản hiện “—”.</span></div>`:`<div class="empty">Chưa có lịch sử.</div>`;
}
/* Chốt giao nhận (anh duyệt 29/10): một dòng lịch sử */
const cellsTxt=g=>Object.entries(g||{}).map(([c,a])=>{ const p=a.map((v,i)=>v?SZ[i]+" "+v:"").filter(Boolean); return p.length?c+" "+p.join(", "):""; }).filter(Boolean).join(" · ");
function recvLogTxt(e){
  if(e.act==="chot-du") return `<b>Chốt giao nhận · giao đủ</b> ${fmt(e.got)}/${fmt(e.total)} áo${e.over?` · giao dư ${fmt(e.over)}`:""}`;
  if(e.act==="chot-thieu") return `<b>Chốt giao thiếu</b> · thiếu ${fmt(e.short)} áo (nhận ${fmt(e.got)}/${fmt(e.total)}), không nhận tiếp · lý do: ${esc(e.reason)}`;
  if(e.act==="cho") return `Tiếp tục chờ xưởng giao · còn thiếu ${fmt(e.short)} áo${e.note?" · "+esc(e.note):""}`;
  if(e.act==="mo-lai") return `<b>Mở lại giao nhận</b>${e.prev&&e.prev.kind?` (trước: ${e.prev.kind==="du"?"chốt giao đủ":"chốt giao thiếu "+fmt(e.prev.short)})`:""} · lý do: ${esc(e.reason)}`;
  return esc(e.act);
}
/* Khung chốt giao nhận: đủ → chốt giao đủ; thiếu → tiếp tục chờ / chốt giao thiếu (bắt buộc lý do). Không sửa số đặt, không đụng tồn / SIXMEN */

    ${r.left?`<div class="small"><b>Còn thiếu:</b> ${esc(lack)}</div>`:""}${r.overQty?`<div class="small"><b>Giao dư:</b> ${esc(over)}</div>`:""}
    <div class="muted small">Số lượng đặt đã chốt giữ nguyên (không sửa cho khớp số nhận). Không cộng tồn thành phẩm, không đổi dữ liệu SIXMEN. Sau khi chốt, đơn sang bước Chứng từ &amp; Bàn giao hồ sơ (chưa Hoàn tất Planning).</div>
    ${r.left?`<div style="display:grid;gap:8px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="field" id="chotNote" value="${esc(chotTxt.note)}" placeholder="Ghi chú (VD xưởng hẹn giao bù ngày…)" style="min-width:260px"><button class="btn" data-chot-wait>Tiếp tục chờ giao</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="field" id="chotReason" value="${esc(chotTxt.reason)}" placeholder="Lý do chốt giao thiếu (bắt buộc)" style="min-width:320px"><button class="btn primary" data-chot-thieu>Chốt giao thiếu, không nhận tiếp ${fmt(r.left)} áo</button></div></div>`

    <div><button class="btn ghost" data-chot-close>Đóng</button></div></div>`;

      +((o.recvLog||[]).length?`<details class="rl small"><summary>Lịch sử chốt giao nhận (${o.recvLog.length})</summary>${o.recvLog.slice().reverse().map(e=>`<div>${Don.hm(e.at)} · ${esc(Khung.userName(e.by))} · ${recvLogTxt(e)}</div>`).join("")}</details>`:"");

          ${can&&!o.arrived?` · <button class="btn ghost" data-void="${x.id}">Huỷ lần giao</button>`:""}</div>`}</div>`; }).join("")
      :`<div class="empty">Xưởng chưa giao lần nào.${can&&Don.stage(o)==="run"?" Bấm <b>📦 Ghi nhận xưởng giao</b> khi xưởng giao.":""}</div>`);
  }

async function exAct(body){
  const f=find(); if(!f) return false;
  const r=await Don.op(Object.assign({model:f.m.key, oid:OID}, body));
  if(r.status!==200) alert((r.j&&r.j.error)||"Không thực hiện được");
  render(); loadLog(); return r.status===200;
}

const fresh=()=>{ if(window.DongBo) DongBo.fresh(Don.KEY); };
const closedMsg=o=>o.recvClose?`Đơn ${Don.label(o)} đã được ${Khung.userName(o.recvClose.by)} chốt giao nhận lúc ${Don.hm(o.recvClose.at)}.`:`Đơn ${Don.label(o)} đã kết thúc giao nhận.`;
function saveReceipt(){
  let ok=false; fresh();
  Don.mutate(OID,(o,S)=>{
    if(o.arrived){ alert(closedMsg(o)+"\nXưởng giao bổ sung: bấm “Mở lại giao nhận” (ghi lý do) rồi ghi nhận."); recvOpen=false; return false; }
    const r=SoLuong.receiptInfo(o,S.perRoll||65), sizes={}, over=[]; let tot=0;
    Object.keys(r.ordered).forEach(c=>{ const a=[0,1,2,3,4].map(i=>Math.max(0,parseInt(draft.q[c+i],10)||0)); if(a.some(v=>v)){ sizes[c]=a; a.forEach((v,i)=>{ tot+=v; const left=Math.max(0,r.ordered[c][i]-((r.received[c]||[])[i]||0)); if(v>left) over.push(`${c} ${SZ[i]}: nhận ${v}, còn ${left}`); }); } });
    const at=new Date(draft.at).getTime();
    if(!tot){ alert("Chưa nhập số áo nhận về."); return false; }
    if(!(at>0)){ alert("Giờ nhận chưa đúng."); return false; }

    (o.receipts=o.receipts||[]).push({id:"r"+Date.now(), at, date:draft.at.slice(0,10), sizes, note:(draft.note||"").trim(), savedAt:Date.now(), by:Khung.me&&Khung.me.id});

const ME=()=>Khung.me&&Khung.me.id;
/* kind: du = chốt giao đủ · thieu = chốt giao thiếu, không nhận tiếp (bắt buộc lý do) · cho = tiếp tục chờ giao (chỉ ghi lịch sử).
   Kiểm lại trên bản mới nhất: đã có người chốt, hoặc số lần giao / số nhận đổi so với lúc mở khung → không lưu */
function doChot(kind){
  const reason=kind==="thieu"?(($("#chotReason")||{}).value||"").trim():"", note=(($("#chotNote")||{}).value||"").trim();
  if(kind==="thieu"&&!reason){ alert("Ghi lý do chốt giao thiếu (bắt buộc)."); const el=$("#chotReason"); if(el) el.focus(); return; }
  fresh(); let ok=false;
  Don.mutate(OID,(o,S)=>{
    if(o.arrived){ alert(closedMsg(o)); return false; }
    const r=SoLuong.receiptInfo(o,S.perRoll||65), R=SoLuong.validReceipts(o), now=Date.now();
    if(!R.length){ alert("Chưa có lần xưởng giao nào."); return false; }
    if(!chotSnap||R.length!==chotSnap.n||r.got!==chotSnap.got){ alert(`Số xưởng giao vừa thay đổi (người khác vừa ghi / huỷ lần giao): nay đã nhận ${fmt(r.got)}/${fmt(r.total)} áo, còn thiếu ${fmt(r.left)}.\nXem lại số rồi chốt lại.`); chotSnap={n:R.length, got:r.got}; return false; }
    if(kind==="du"&&r.left){ alert(`Còn thiếu ${fmt(r.left)} áo: không chốt giao đủ được.`); return false; }
    if(kind!=="du"&&!r.left){ alert("Đã nhận đủ: chọn Chốt giao đủ."); return false; }
    if(kind==="cho"){ (o.recvLog=o.recvLog||[]).push({at:now, by:ME(), act:"cho", note, short:r.left, got:r.got, total:r.total}); ok=true; return; }
    const lack={}, over={}; Object.keys(r.short).forEach(c=>{ if(r.short[c].some(v=>v)) lack[c]=r.short[c].slice(); if(r.over[c].some(v=>v)) over[c]=r.over[c].slice(); });
    if(!confirm(kind==="du"?`Chốt giao đủ đơn ${Don.label(o)}?\nĐã nhận ${fmt(r.got)}/${fmt(r.total)} áo${r.overQty?` (giao dư ${fmt(r.overQty)}: ${cellsTxt(over)})`:""}.\n\nSau khi chốt: sang bước Chứng từ & Bàn giao hồ sơ. Không cộng tồn, không đổi dữ liệu SIXMEN.`
      :`Chốt giao THIẾU đơn ${Don.label(o)}?\nĐã nhận ${fmt(r.got)}/${fmt(r.total)} áo · thiếu ${fmt(r.left)} áo (${cellsTxt(lack)}).\nLý do: ${reason}\n\nKhông nhận tiếp phần còn lại: phần thiếu thôi tính vào Đã đặt. Số đặt giữ nguyên.\nSau khi chốt: sang bước Chứng từ & Bàn giao hồ sơ.`)) return false;
    const date=R.map(x=>x.date).sort().pop();
    o.recvClose={kind, at:now, by:ME(), date, reason, total:r.total, got:r.got, short:r.left, over:r.overQty, shortBy:lack, overBy:over, receipts:R.map(x=>x.id)};
    (o.recvLog=o.recvLog||[]).push({at:now, by:ME(), act:kind==="du"?"chot-du":"chot-thieu", reason, total:r.total, got:r.got, short:r.left, over:r.overQty});
    SoLuong.syncArrived(o); ok=true;
  });
  if(ok){ chotOpen=false; chotSnap=null; chotTxt={reason:"", note:""}; if(kind!=="cho") tab="chung-tu"; history_replace(); render(); }
  else render();
}

    if(!tonAt){ alert("Chưa có bảng tồn SIXMEN cho mã này. Dán bảng tồn ở Phân tích nhu cầu trước."); return; }
    if(tonAt<x.at){ alert(`Bảng tồn SIXMEN đang dùng dán lúc ${Don.hm(tonAt)}, TRƯỚC lần giao ${Don.hm(x.at)} → chưa thể có số này.\nDán bảng tồn mới ở Phân tích nhu cầu rồi đối chiếu lại.`); return; }
    if(!confirm(`Xác nhận bảng tồn SIXMEN dán lúc ${Don.hm(tonAt)} ĐÃ CÓ số của lần giao ${Don.hm(x.at)}?\nSau khi xác nhận, lần giao này thôi tính vào Đã đặt (đã nằm trong tồn SIXMEN). Planning không đổi số tồn.`)) return;
    Don.mutate(OID,o=>{ const y=(o.receipts||[]).find(z=>z.id===x.id); if(!y) return false; y.sixmen={at:Date.now(), by:ME(), tonAt}; }); return; }
  if(b.dataset.sixmenOff){ const reason=(prompt("Bỏ đối chiếu tồn SIXMEN của lần giao này? Lần giao sẽ tính lại vào Đã đặt.\nGhi lý do (bắt buộc):")||"").trim(); if(!reason) return;
    Don.mutate(OID,o=>{ const y=(o.receipts||[]).find(z=>z.id===b.dataset.sixmenOff); if(!y||!y.sixmen) return false; (y.sixmenLog=y.sixmenLog||[]).push({...y.sixmen, offAt:Date.now(), offBy:ME(), reason}); delete y.sixmen; }); return; }
  /* Chứng từ: đánh dấu bước kế tiếp đã xong (đúng thứ tự), không hỏi số chứng từ (anh chốt 27/10: số HĐ đã có ở nghiệp vụ khác, hỏi lại là trùng).
     Vẫn ghi người + giờ. Bỏ bước cuối cùng phải có lý do */
  if(b.dataset.doc){ const [rid,k]=b.dataset.doc.split("|"), d=Don.DOCS.find(z=>z.k===k); if(!d) return;
    const doc="", note="";
    Don.mutate(OID,o=>{ const y=(o.receipts||[]).find(z=>z.id===rid); if(!y||y.void||o.doneAt) return false;
      const i=Don.DOCS.findIndex(z=>z.k===k); if(Don.DOCS.slice(0,i).some(z=>!Don.docDone(y,z.k))||Don.docDone(y,k)){ alert("Phải xong bước trước."); return false; }
      const now=Date.now(); (y.docs=y.docs||{})[k]={at:now, by:ME(), doc, note}; (y.docsLog=y.docsLog||[]).push({at:now, by:ME(), k, act:"xong", doc, note}); }); return; }
  if(b.dataset.docundo){ const [rid,k]=b.dataset.docundo.split("|"), d=Don.DOCS.find(z=>z.k===k); const reason=(prompt(`Bỏ đánh dấu “${d?d.t:k}”? Ghi lý do (bắt buộc):`)||"").trim(); if(!reason) return;
    Don.mutate(OID,o=>{ const y=(o.receipts||[]).find(z=>z.id===rid); if(!y||o.doneAt||!Don.docDone(y,k)) return false; const i=Don.DOCS.findIndex(z=>z.k===k); if(Don.DOCS.slice(i+1).some(z=>Don.docDone(y,z.k))){ alert("Bỏ từ bước cuối cùng trước."); return false; }
      const old=y.docs[k]; delete y.docs[k]; (y.docsLog=y.docsLog||[]).push({at:Date.now(), by:ME(), k, act:"bo", doc:old.doc, reason}); }); return; }
  /* Hoàn tất Planning: xưởng giao đủ (hoặc lần giao cuối đã xác nhận thiếu / dư) + đủ chứng từ mọi lần giao + bàn giao hồ sơ (người nhận, thời điểm).
     Không chờ nhập kho ERP / Nhanh.vn / SIXMEN cập nhật tồn */
  /* Bàn giao hồ sơ (V3, server ghi, chống bấm trùng): ghi nhận → bên nhận xác nhận (tài khoản) / Admin xác nhận hợp lệ (chưa có tài khoản) → Hoàn tất */
  if(b.hasAttribute("data-finish")){ const f=find(); if(!f||!Don.canFinish(f.o)){ alert("Chưa đủ điều kiện: xưởng phải được chốt giao nhận và đủ chứng từ."); return; }
    const to=(($("#bgTo")||{}).value||""), name=(($("#bgName")||{}).value||"").trim(), ev=(($("#bgEv")||{}).value||"").trim(), note=(($("#bgNote")||{}).value||"").trim(); bgTxt={to, name, ev, note};
    if(!to&&!name){ bgMsg="Chọn tài khoản người nhận, hoặc ghi tên người / bộ phận nhận."; render(); return; }
    if(!to&&!ev){ bgMsg="Người nhận chưa có tài khoản: ghi bằng chứng bàn giao."; render(); return; }
    if(!confirm(`Ghi nhận bàn giao hồ sơ đơn ${Don.label(f.o,f.m)} cho ${to?Khung.userName(to):name}?\nĐơn chuyển sang “Đã ghi nhận bàn giao — Chờ xác nhận”; Hoàn tất khi ${to?"người nhận xác nhận bằng tài khoản":"Admin xác nhận bằng chứng hợp lệ"}.`)) return;
    bgAct({op:"bg-ghi", toUser:to, toName:name, evidence:ev, note}); return; }
  if(b.hasAttribute("data-bgok")){ const f=find(); if(!f) return; if(!confirm(`Xác nhận đã nhận đủ hồ sơ đơn ${Don.label(f.o,f.m)}? Đơn sẽ Hoàn tất Planning.`)) return; bgAct({op:"bg-xac-nhan"}); return; }
  if(b.hasAttribute("data-bghuy")){ const reason=(prompt("Huỷ ghi nhận bàn giao? Ghi lý do (bắt buộc):")||"").trim(); if(!reason) return; bgAct({op:"bg-huy", reason}); return; }
  if(b.hasAttribute("data-undone")){ if(!Khung.isAdmin()) return; const reason=(prompt("Mở lại đơn đã hoàn tất Planning? Ghi lý do (bắt buộc):")||"").trim(); if(!reason) return; bgAct({op:"bg-mo-lai", reason}); return; }
  /* Chứng từ V3 */
  if(b.dataset.ctadd){ const t=b.dataset.ctadd; ctEdit(t,null,(o,x)=>{ const id="ct"+Date.now(); x.list.push({id, status:"chua", ref:"", owner:ME(), doneDate:"", note:"", at:Date.now(), by:ME()}); ctLog(o,{t, id, act:"them"}); }); return; }
  /* UX-2: tick nhanh Hoàn thành = đúng thao tác chọn "Hoàn thành" ở ô trạng thái (ghi ngày hôm nay nếu chưa có, có lịch sử) */
  if(b.dataset.ctdone){ const [t,id]=b.dataset.ctdone.split("|");
    ctEdit(t,id,(o,x,i)=>{ if(!i||i.status==="xong") return false; if(!i.doneDate){ ctLog(o,{t, id, act:"sua", f:"doneDate", from:"", to:Don.today()}); i.doneDate=Don.today(); }
      ctLog(o,{t, id, act:"sua", f:"status", from:i.status||"", to:"xong"}); i.status="xong"; i.at=Date.now(); i.by=ME(); }); return; }
  if(b.dataset.ctdel){ const [t,id]=b.dataset.ctdel.split("|"); const f=find(), it=f&&(((f.o.ctu||{})[t]||{}).list||[]).find(i=>i.id===id); if(!it) return;
    const reason=it.status==="xong"||it.ref?(prompt("Xoá chứng từ này? Ghi lý do (bắt buộc):")||"").trim():"-"; if(!reason) return;
    ctEdit(t,id,(o,x,i)=>{ if(!i) return false; x.list=x.list.filter(z=>z.id!==id); ctLog(o,{t, id, act:"xoa", prev:i, reason:reason==="-"?"":reason}); }); return; }
  if(b.dataset.ctna){ if(!Khung.isAdmin()) return; const t=b.dataset.ctna; const reason=(prompt("Đánh dấu loại chứng từ này Không áp dụng cho đơn? Ghi lý do (bắt buộc):")||"").trim(); if(!reason) return;
    ctEdit(t,null,(o,x)=>{ if(x.list.length) return false; x.na={at:Date.now(), by:ME(), reason}; ctLog(o,{t, act:"na", reason}); }); return; }
  if(b.dataset.ctnaOff){ if(!Khung.isAdmin()) return; const t=b.dataset.ctnaOff; const reason=(prompt("Bỏ “Không áp dụng”? Ghi lý do (bắt buộc):")||"").trim(); if(!reason) return;
    ctEdit(t,null,(o,x)=>{ if(!x.na) return false; ctLog(o,{t, act:"bo-na", prev:x.na, reason}); delete x.na; }); return; }
  if(b.hasAttribute("data-uncancel")){ if(!confirm("Khôi phục đơn đã huỷ? Đơn sẽ trừ lại vào Cần đặt.")) return;
    Don.mutate(OID,o=>{ (o.cancelLog=o.cancelLog||[]).push({...o.cancelled, restoredAt:Date.now(), restoredBy:ME()}); delete o.cancelled; }); return; }
  if(b.hasAttribute("data-reopen")){ const f0=find(); if(f0&&f0.o.qlvh){ alert("Đơn đã được xác nhận QLVH duyệt PO: không mở lại kế hoạch được (PO trên ERP đã duyệt theo số này). Nếu bấm nhầm, Admin bỏ xác nhận trước."); return; }
    if(!confirm("Mở lại đơn này ở trang Kế hoạch để sửa? Đơn sẽ rời mục Đang chạy cho tới khi chốt lại.")) return;
    let mk=null;
    Don.mutate(OID,(o,S,p)=>{ mk=Object.keys(S.models).find(k=>S.models[k]===p);
      if(o.type){ const g=(p.grids=p.grids||{})[o.type]=p.grids[o.type]||{}; Object.entries(o.sizes).forEach(([c,a])=>{ g[c]=(g[c]||[null,null,null,null,null]).map((v,i)=>(v||0)+(a[i]||0)||null); }); p.gapOrders=p.gapOrders.filter(x=>x!==o); }
      else { delete o.closed; o.reopenLog=(o.reopenLog||[]).concat({at:Date.now(), by:ME()}); } });
    location.href="ke-hoach.html"+(mk?"?m="+mk:""); return; }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="due") Don.mutate(OID,o=>{ if(t.value) o.dueDate=t.value; else delete o.dueDate; });
  if(t.id==="nvlNeed") Don.mutate(OID,o=>{ if(t.value) o.nvlNeedDate=t.value; else delete o.nvlNeedDate; });
  if(t.id==="started"){ if(!t.value||t.value>Don.today()){ alert("Ngày bắt đầu chưa đúng."); render(); return; } Don.mutate(OID,o=>{ o.startedAt=t.value; o.startedBy=ME(); }); }
  if(t.id==="qPo2") Don.mutate(OID,o=>{ if(o.qlvh) return false; const v=t.value.trim(); if(v===(o.erpCode2||"")) return false; o.erpCode2=v; if(v){ o.erpAt2=Date.now(); o.erpBy2=ME(); } else { delete o.erpAt2; delete o.erpBy2; } });
  if(t.id==="erp"||t.id==="qPo") Don.mutate(OID,o=>{ if(o.qlvh) return false;   /* ô mã PO ở Duyệt PO: nhập xong lưu ngay (đơn sang "Chờ QLVH duyệt"), xác nhận duyệt vẫn là nút riêng */ const v=t.value.trim(); if(v===(o.erpCode||"")) return false; o.erpCode=v; if(v){ o.erpAt=Date.now(); o.erpBy=ME(); } else { delete o.erpAt; delete o.erpBy; } });
  if(t.dataset.tick) Don.mutate(OID,o=>{ o.calls=o.calls||{}; o.calls[t.dataset.tick]={...(o.calls[t.dataset.tick]||{}), done:t.checked, at:Don.today(), by:ME()}; });
  if(t.id==="rAt") draft.at=t.value;
  if(t.id==="bgTo"){ bgTxt.to=t.value; const nm=$("#bgName"); if(nm) nm.hidden=!!t.value; }
  if(t.dataset.ct){ const [ct,id,fld]=t.dataset.ct.split("|"); let v=t.value.trim();
    ctEdit(ct,id,(o,x,i)=>{ if(!i||(i[fld]||"")===v) return false;
      if(fld==="status"&&v==="xong"&&!i.doneDate){ ctLog(o,{t:ct, id, act:"sua", f:"doneDate", from:"", to:Don.today()}); i.doneDate=Don.today(); }   // hoàn thành mà chưa ghi ngày → lấy hôm nay (sửa được)
      if(fld==="doneDate"&&v>Don.today()){ alert("Ngày hoàn thành đang ở tương lai."); return false; }
      ctLog(o,{t:ct, id, act:"sua", f:fld, from:i[fld]||"", to:v}); i[fld]=v; i.at=Date.now(); i.by=ME(); }); }
});
let nt;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.rq){ draft.q[t.dataset.rq.replace("|","")]=t.value; return; }
  if(t.id==="rNote"){ draft.note=t.value; return; }
  if(t.id==="chotReason"||t.id==="chotNote"){ chotTxt[t.id==="chotReason"?"reason":"note"]=t.value; return; }
  if(t.id==="qPo"){ qTxt.po=t.value; return; }
  if(t.id==="qPo2"){ qTxt.po2=t.value; return; }
  if(t.id==="bgName"||t.id==="bgEv"||t.id==="bgNote"){ bgTxt[{bgName:"name",bgEv:"ev",bgNote:"note"}[t.id]]=t.value; return; }
  if(t.id==="qAck"){ qTxt.ack=t.checked; return; }
  if(t.dataset.note){ clearTimeout(nt); nt=setTimeout(()=>{ const S=Don.readS(); for(const p of Object.values(S.models||{})) for(const o of [...(p.orders||[]),...(p.gapOrders||[])]) if(o.id===OID){ o.calls=o.calls||{}; o.calls[t.dataset.note]={...(o.calls[t.dataset.note]||{}), note:t.value}; } localStorage.setItem(Don.KEY,JSON.stringify(S)); },400); }
});
function history_replace(){ try { history.replaceState(null,"","#"+tab); } catch(e){} }
const typing=()=>{ const a=document.activeElement; return a&&(a.dataset&&(a.dataset.note||a.dataset.rq||a.dataset.nq)||a.id==="rNote"||a.id==="chotReason"||a.id==="chotNote"||a.id==="erp"||a.id==="pxNote"||a.id==="qPo"||a.id==="qPo2"||a.id==="bgName"||a.id==="bgEv"||a.id==="bgNote"||(a.dataset&&a.dataset.ct&&a.tagName==="INPUT")); };
Don.onChange(()=>{ if(!typing()) render(); });
window.addEventListener("storage",e=>{ if(["kehoach-sx-v3","danhmuc-v1","nvl-v3"].includes(e.key)&&!typing()) render(); });
$("#menuBtn").addEventListener("click",e=>{ e.stopPropagation(); document.body.classList.toggle("nav-open"); });
render();
const loadLog=()=>Don.fetchLog({oid:OID, limit:500}).then(r=>{ SRV=r; if((tab==="lich-su"||tab==="timeline")&&!typing()) render(); });
loadLog(); Don.onChange(()=>setTimeout(loadLog,1500));   // sau mỗi lần sửa, đọc lại nhật ký server
</script>
