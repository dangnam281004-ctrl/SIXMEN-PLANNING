<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="dong-bo.js"></script>
<script src="so-luong.js"></script>
<script src="nvl-core.js"></script>
<script src="khung.js"></script>
<script src="don.js"></script>
<script src="phan-tich.js"></script>
<script src="canh-bao.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tổng quan · SIXMEN Planning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="khung.css">
<link rel="stylesheet" href="ux.css">
<style>
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
/* Mỗi đơn 1 dòng, cột cố định để thẳng hàng: nhãn việc gấp nhất · đơn + các việc · người phụ trách · nút */
.task{display:grid;grid-template-columns:132px minmax(0,1fr) 110px 190px;gap:12px;align-items:start;padding:11px 14px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .tg .pill{white-space:normal;line-height:1.3;text-align:center}
.task .lb{font-weight:700} .task .sb{color:var(--muted);font-size:12px;margin-top:2px}
.task .sb b{color:var(--ink2);font-weight:600}
.task .ow{color:var(--ink2);font-size:12px;padding-top:2px}
.task .ac{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.sev3{box-shadow:inset 3px 0 0 var(--crit)} .sev2{box-shadow:inset 3px 0 0 var(--warn)} .sev1{box-shadow:inset 3px 0 0 var(--accent)}
.wk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;text-decoration:none;color:inherit}
.wk:hover{background:var(--hover)} .wk:last-child{border-bottom:none}
.wk b{font-variant-numeric:tabular-nums} .wk small{display:block;color:var(--muted);font-size:11px}
.hi{font-size:13px;color:var(--ink2)}
/* UX-1 · việc theo hạn: nhóm Quá hạn / Hôm nay / Sắp tới, 1 dòng = 1 việc, 1 nút chính đặt tên theo việc */
.tq{display:grid;grid-template-columns:78px 132px minmax(0,1fr) 96px auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.tq:last-child{border-bottom:none}
.tq .due{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}.tq .due small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.tq .tg .pill{white-space:normal;line-height:1.3}
.tq .lb{font-weight:700}.tq .sb{color:var(--muted);font-size:12px;margin-top:1px}
.tq .ow{color:var(--ink2);font-size:12px}
.tq .ac{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.bk{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--head);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bk .n{font-variant-numeric:tabular-nums}.bk.qh{color:var(--crit)}.bk.hn{color:var(--warn)}
details.bkd>summary{list-style:none;cursor:pointer}details.bkd>summary::-webkit-details-marker{display:none}
details.bkd>summary .tog{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent)}
.dlg-back{position:fixed;inset:0;z-index:60;background:rgba(15,20,18,.35);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.dlg{background:var(--surface);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);width:min(560px,100%);padding:16px 18px;display:grid;gap:10px}
.dlg h3{font-size:15px}.dlg .kv2{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 10px;font-size:13px}.dlg .kv2 span:nth-child(odd){color:var(--muted)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* V5.4 Đợt 1: ô chỉ số chia 4 nhóm · chip vấn đề (Q8) · thanh kỳ cập nhật + chuông Quá hạn / Sắp hạn */
.tq-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tq-grp{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:8px;align-content:start}
.tq-grp .gl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tq-grp .ux-kpis{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.chips5{display:flex;flex-wrap:wrap;gap:4px}
.ic{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.ic.r{background:var(--crit-bg,#fdecea);color:var(--crit,#c62828)}.ic.o{background:var(--warn-bg,#fff4e0);color:var(--warn,#b26a00)}.ic.g{background:var(--line);color:var(--ink2)}.ic.b{background:var(--accent-bg,#e8f0fe);color:var(--accent,#1f5fae)}.ic.k{background:#e7f5ec;color:var(--ok,#1e7d45)}
button.ic{cursor:pointer;font:inherit;font-size:11.5px;font-weight:700}
.bellbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#exList td.cause{max-width:300px;font-size:12px;color:var(--ink2)}
#exList td.due54{white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:1100px){.tq-groups{grid-template-columns:1fr}}
@media (max-width:900px){.tq{grid-template-columns:70px minmax(0,1fr);}.tq .tg,.tq .ow{display:none}.tq .ac{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:700px){.task{grid-template-columns:1fr}.task .ac{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><span class="logo">S</span><div><b>SIXMEN</b><small>Planning sản xuất</small></div></div><nav class="nav" aria-label="Điều hướng"></nav><div class="side-foot"></div></aside>
  <div class="col">
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button><div class="tt"><b>Tổng quan</b><small id="sub"></small></div></header>
    <div class="content">
      <div id="rptWarn"></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center"><div class="hi" id="hi"></div><div class="bellbar" id="bell"></div><div id="rptState" style="margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center"></div></div>
      <div class="ux-kpis" id="tiles"></div>
      <div class="panel" id="buySoon" hidden></div>
      <div class="panel" id="moiBox" hidden></div>
      <div class="panel" id="vuongBox"></div>
      <div class="grid2">
        <div class="panel"><div class="ph"><h2>Việc cần làm</h2><span class="muted small" id="tcount"></span></div><div id="tasks"></div></div>
        <div class="panel"><div class="ph"><h2>Lịch 7 ngày tới</h2></div><div id="week"></div></div>
      </div>
      <div class="panel"><div class="ph"><h2 id="exTitle">Đơn đang thực hiện</h2><span class="muted small" id="exCount"></span></div><div class="scroll" id="exList"></div></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), esc=Khung.esc, fmt=Don.fmt;
const TAG={3:"p-bad",2:"p-warn",1:"p-run"};
function render(){
  const S=Don.readS(); SoLuong.mark(S);
  const t=Don.today(), d=new Date(), L=Don.tasks(S), list=Don.all(S);
  const run=list.filter(x=>Don.stage(x.o)==="run"), ms=Khung.models().filter(m=>Khung.visible(m.key));
  const H=Don.heroes(), stale=ms.filter(m=>{ const at=SoLuong.heroAt(H[m.key]); return !at||new Date(at).toDateString()!==d.toDateString(); });
  $("#sub").textContent=`${Don.thu(t)} ${d.toLocaleDateString("vi-VN")} · ${Khung.me?esc(Khung.me.name):""}`;
  { const ttl=isExecUser()?"Công việc của tôi":"Tổng quan quản lý"; $(".topbar .tt b").textContent=ttl; document.title=ttl+" · SIXMEN Planning"; }   // V5.2: màn hình đầu theo vai trò
  const late=run.filter(x=>x.o.dueDate&&x.o.dueDate<t).length, soon=run.filter(x=>x.o.dueDate&&x.o.dueDate>=t&&Don.diff(t,x.o.dueDate)<=3).length;
  /* UX-1: việc lấy nguyên từ Don.tasks(); chỉ thêm hạn, nhóm theo hạn và nút đặt tên theo việc (Don.taskView) */
  const V=L.map(x=>({x, v:Don.taskView(x,S)})), B={"qua-han":[], "hom-nay":[], "theo-doi":[]}; V.forEach(y=>B[y.v.bucket].push(y));
  const byDue=(a,b)=>(a.v.due||"9999").localeCompare(b.v.due||"9999")||b.x.sev-a.x.sev;
  Object.values(B).forEach(a=>a.sort(byDue));
  const qp=V.filter(y=>/QLVH|mã PO/.test(y.x.tag)).length;
  $("#hi").innerHTML=L.length?`Có <b style="color:${B["qua-han"].length?"var(--crit)":"inherit"}">${B["qua-han"].length} việc quá hạn / gấp</b> và <b>${B["hom-nay"].length} việc cần làm hôm nay</b>${B["theo-doi"].length?` · ${B["theo-doi"].length} việc sắp tới`:""}.`:"Không có việc gì cần xử lý theo bộ lọc này.";
  { const D=dash(S,list,t);   /* V5.4: Admin / quản lý thấy 4 nhóm ô; nhân viên giữ 1 hàng ô như V5.3 */
    if(D.length&&D[0].group){ $("#tiles").className="tq-groups"; $("#tiles").innerHTML=D.map(g=>`<div class="tq-grp" data-grp="${esc(g.group)}"><div class="gl">${esc(g.group)}</div><div class="ux-kpis">${kpiHtml(g.tiles)}</div></div>`).join(""); }
    else { $("#tiles").className="ux-kpis"; $("#tiles").innerHTML=kpiHtml(D); } }
  renderBell(S,list,t); renderBuySoon();
  $("#tcount").textContent=L.length?`${L.length} việc · sắp theo hạn`:"";
  renderExec(S,list,t); renderVuong(S); renderMoi(S); rptCheck(); rptTile();
  const row=({x,v})=>{ const can=!v.mk||Khung.canEdit(v.mk)||(v.o&&Don.isMyExec(v.o))||x.ownerText==="Admin"||/Xác nhận nhận hồ sơ/.test(x.tag), late=v.due&&v.due<t;
    const main=v.kind==="call"&&can?`<button class="btn primary" data-call="${x.oid}|${x.call}" title="${esc(x.phone||"")}">✓ Đã gọi</button>`
      :v.kind==="qlvh"&&can?`<button class="btn primary" data-qlvh-view="${x.oid}">${esc(v.label)}</button>`
      :`<a class="btn${can?" primary":""}" href="${v.href}">${esc(can?v.label:"Xem")}</a>`;
    return `<div class="tq sev${x.sev}" data-task="${esc(x.tag)}">
      <span class="due">${v.due?`${Don.dm(v.due)}<small>${v.due===t?"hôm nay":late?"trễ "+Don.diff(v.due,t)+" ngày":Don.thu(v.due)}</small>`:`<small>${x.sev>=2?"cần làm":"theo dõi"}</small>`}</span>
      <span class="tg"><span class="pill ${v.bucket==="qua-han"?"p-bad":v.bucket==="hom-nay"?"p-warn":"p-run"}">${esc(x.tag)}</span></span>
      <div style="min-width:0"><div class="lb">${esc(x.label)}</div><div class="sb">${esc(x.sub)}</div></div>
      <span class="ow">${(()=>{ const w=x.ownerText||Khung.userName(x.owner); return Khung.me&&(x.owner===Khung.me.id&&!x.ownerText||w===Khung.userName(Khung.me.id))?"":esc(w); })()}</span>
      <div class="ac">${main}${v.o&&v.href.indexOf("don-hang.html")<0?`<a class="btn ghost" href="don-hang.html?id=${encodeURIComponent(v.o.id)}">Mở đơn</a>`:v.kind!=="link"?`<a class="btn ghost" href="${v.href}">Mở đơn</a>`:""}</div></div>`; };
  const sec=(k,title,cls,open)=>{ const a=B[k]; if(!a.length) return "";
    const head=`<span>${title}</span><span class="n">· ${a.length}</span>`;
    return open?`<div id="bk-${k}"><div class="bk ${cls}">${head}</div>${a.map(row).join("")}</div>`
      :`<details class="bkd" id="bk-${k}"${bkOpen?" open":""}><summary class="bk ${cls}">${head}<span class="tog">${bkOpen?"Thu gọn":"Hiện"}</span></summary>${a.map(row).join("")}</details>`; };
  $("#tasks").innerHTML=L.length?sec("qua-han","Quá hạn","qh",true)+sec("hom-nay","Hôm nay","hn",true)+sec("theo-doi","Sắp tới · theo dõi","",false)
    :`<div class="empty">Không có việc nào. ${Khung.filter().mode==="mine"?"Chọn “Tất cả” để xem việc của mọi mã.":""}</div>`;
  const W=Don.week(S);
  $("#week").innerHTML=W.length?W.map(e=>`<a class="wk" href="${e.href}"><span><b>${Don.dm(e.date)}</b><small>${Don.thu(e.date)}</small></span><span${e.arrive?` style="color:var(--ok);font-weight:600"`:""}>${esc(e.text)}</span></a>`).join(""):`<div class="empty">Không có mốc nào trong 7 ngày tới.</div>`;
}
/* ===== V5 (anh duyệt 10/11/2026): Tổng quan theo vai trò =====
   Người thực thi (nhân viên): việc của các đơn được giao. Quản lý kế hoạch / Admin: kế hoạch chưa chốt, bàn giao chờ PO, chờ QLVH, đang SX / nguy cơ trễ, thiếu chứng từ, vướng mắc */
const isExecUser=()=>Khung.me&&Khung.me.role==="staff";
function execOrders(list){ return list.filter(x=>Don.isMyExec(x.o)); }
/* UX V5 (anh duyệt 13/11/2026): mọi ô chỉ số có dữ liệu bấm được → lọc đúng danh sách bên dưới (số trên ô = số dòng sau lọc), hoặc mở đúng trang đã lọc.
   Ô = 0 không bấm. Đăng Nam: việc cần quyết định, đơn chờ thực thi, quá hạn, thiếu NVL, thiếu hồ sơ, báo cáo cuối ngày. Minh Tiến: việc của đơn được giao */
let EXF="";
const exBase=(list)=>(isExecUser()?execOrders(list):list).filter(x=>x.o.closed&&!x.o.cancelled&&!x.o.doneAt&&!Don.isPlan(x.o));
/* V5.4: 2 danh sách không phải đơn đã chốt (ô "Kế hoạch chờ chốt", "Kế hoạch tương lai") → số trên ô = số dòng */
const ALTBASE={kh:list=>list.filter(x=>Don.stage(x.o)==="pending"&&!Don.isPlan(x.o)&&!x.o.cancelled), khtl:list=>list.filter(x=>Don.isPlan(x.o)&&!x.o.cancelled)};
const ISS=(x,S)=>x._iss||(x._iss=Don.issues(x.o,S,x.m.key));
function exPreds(S,t){
  const ph=x=>Don.phase(x.o), late=x=>!!Don.statusOf(x.o,S).late, I=x=>ISS(x,S), has=(x,k)=>I(x).some(i=>i.k===k);
  const v54={tra:[x=>ph(x)==="tra-lai","Bị trả lại"], chuabg:[x=>ph(x)==="chua-bg","Đã chốt — Chưa bàn giao"],
    quahan:[x=>I(x).some(i=>i.rank===1),"Quá hạn (giao · tiếp nhận · PO)"], sap:[x=>has(x,"sap-han-giao"),"Sắp đến hạn giao"],
    nvl54:[x=>has(x,"nvl"),"Thiếu NVL"], ct54:[x=>has(x,"chung-tu"),"Thiếu chứng từ"], chuahan:[x=>has(x,"chua-han"),"Chưa có hạn giao"],
    kh:[()=>true,"Kế hoạch chờ chốt (đơn đang lập)"], khtl:[()=>true,"Kế hoạch tương lai"]};
  const callDue=x=>Don.stage(x.o)==="run"&&!x.o.arrived&&Don.milestones(x.o,Don.cfgOf(S)).some(m=>m.date<=t&&!((x.o.calls||{})[m.date]||{}).done);
  const nvl=x=>{ if(ph(x)!=="da-chot"||x.o.type) return false; const C=Don.nvlOf(x.o,S,x.m.key); return !(C.state==="du"||C.state==="khong-can"); };
  return {
    moi:[x=>ph(x)==="cho-nhan","Chờ tiếp nhận"], bg:[x=>ph(x)==="chua-bg"||ph(x)==="tra-lai","Chờ bàn giao / bị trả lại"], po1:[x=>ph(x)==="cho-po"&&(!!Don.po1(x.o)||!!Don.po2(x.o)),"Thiếu 1 trong 2 mã PO"], po:[x=>ph(x)==="cho-po","Chờ tạo PO"],
    qlvh:[x=>ph(x)==="cho-qlvh","Chờ QLVH ký, duyệt"], gui:[x=>!!x.o.qlvh&&!x.o.sentAt&&!SoLuong.validReceipts(x.o).length,"Cần gửi xưởng"], goi:[callDue,"Đến lịch liên hệ xưởng"],
    tre:[late,"Quá hạn / chậm tiến độ"], hs:[x=>!!x.o.arrived&&!x.o.doneAt,"Hồ sơ chưa hoàn thành"], ct:[x=>!!x.o.arrived&&!x.o.doneAt&&!Don.docState(x.o).all,"Còn thiếu chứng từ"],
    nvl:[nvl,"Thiếu NVL (chờ NVL)"], vuong:[x=>Don.openIssues(x.o).length>0,"Có vướng mắc"], ...v54};
}
function dash(S,list,t){
  const L=exBase(list), P=exPreds(S,t), c=k=>L.filter(P[k][0]).length;
  const T=(k,l,d,tone)=>({v:c(k),l,d,tone,go:"ex:"+k});
  let NN={}; try { NN=JSON.parse(localStorage.getItem("nvl-v3"))||{}; } catch(e) {}
  const me=Khung.me&&Khung.me.id, BL=(NN.buyLists||[]).filter(B=>B.status!=="huy"&&!B.doneAt&&(!isExecUser()||(B.giao&&B.giao.user===me)));
  const nTre=BL.filter(B=>Don.buyLate(B)).length, nHs=BL.filter(B=>Don.buyHsLate(B)>0).length, nV=Don.tasks(S).filter(x=>x.vuong).length;
  if(isExecUser()) return [
    T("moi","Chờ tiếp nhận","đã bàn giao, tiếp nhận hoặc trả lại","r"), T("po1","Thiếu 1 trong 2 mã PO","nhập đủ PO 1 và PO 2","o"), T("qlvh","Chờ QLVH ký, duyệt","đủ 2 PO, chờ QLVH","o"),
    T("gui","Cần gửi xưởng","QLVH đã duyệt, chưa gửi","o"), T("goi","Đến lịch liên hệ xưởng","mốc gọi hôm nay / quá hạn","o"), T("tre","Chậm tiến độ","quá ngày xưởng hẹn giao","r"),
    T("hs","Hồ sơ chưa hoàn thành","chứng từ, hoá đơn, bàn giao","o"),
    {v:nTre,l:"NVL · NCC trễ hẹn",d:"đơn mua NVL được giao cho tôi",tone:"r",go:"dat-mua.html?w=tre"}, {v:nHs,l:"NVL · hồ sơ quá hạn",d:"quá 3 ngày sau khi nhận đủ",tone:"r",go:"dat-mua.html?w=hsqh"}];
  /* V5.4 Đợt 1 (anh duyệt 17/11/2026): 4 nhóm theo câu hỏi người quản lý cần trả lời. Mọi ô có số đều mở đúng danh sách (UX1), số trên ô = số dòng */
  const A=k=>ALTBASE[k](list).length, CF=Don.CFG54;
  const nNhan=L.filter(x=>P.moi[0](x)&&ISS(x,S).some(i=>i.k==="qua-han-nhan")).length, nPo=L.filter(x=>P.po[0](x)&&ISS(x,S).some(i=>i.k==="po"&&i.rank===1)).length;
  const nSoon=BL.filter(B=>Don.buyAlerts(B).some(a=>a.k==="ncc-sap")).length;
  const K=skuCount(), PG=Don.periodProgress(S), vis=Khung.models().filter(m=>Khung.visible(m.key)&&Khung.match(m.name,m.code,Khung.aliasOf(m))), nKy=vis.filter(m=>PG.list[m.key]&&PG.list[m.key].k!=="du").length;
  return [
    {group:"Cần tôi quyết định", tiles:[T("tra","Bị trả lại","→ xử lý & bàn giao lại","r"), {v:nV,l:"Vướng mắc mở",d:"→ danh sách vướng mắc (đơn SX + đơn mua NVL)",tone:"r",go:"#vuongBox"},
      T("chuabg","Chờ bàn giao","đã chốt, chưa bàn giao · → danh sách","o"), {v:A("kh"),l:"Kế hoạch chờ chốt",d:"đơn đang lập · → danh sách",tone:"o",go:"ex:kh"}]},
    {group:"Đang chờ người khác", tiles:[T("moi","Chờ tiếp nhận",`${nNhan} quá ${CF.nhanHours} giờ · → danh sách`,"b"), T("po","Chờ PO ERP",`${nPo} quá ${CF.poHours/24} ngày · → danh sách`,"b"), T("qlvh","Chờ QLVH ký, duyệt","đủ 2 mã PO · → danh sách","b")]},

/* "Xem & xác nhận QLVH" (anh duyệt 31/10): hộp hiện đủ mã đơn, mã PO ERP, trạng thái trước khi xác nhận. Gọi đúng thao tác server như Chi tiết đơn
   (server kiểm quyền, ghi lịch sử, chống bấm trùng). Chưa có mã PO thì không xác nhận được ở đây */
function qlvhDialog(oid){
  const S=Don.readS(); let f=null; Don.all(S,true).forEach(y=>{ if(y.o.id===oid) f=y; }); if(!f) return;
  const {o,m}=f, X=Don.xOf(o), po=Don.po1(o), po2=Don.po2(o), full=Don.poFull(o), ph=Don.phase(o), poV=v=>v?esc(v):`<span style="color:var(--crit)">chưa có</span>`;
  const box=document.createElement("div"); box.className="dlg-back";
  box.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="Xác nhận QLVH đã ký và duyệt"><h3>Xác nhận QLVH đã ký &amp; duyệt 2 PO</h3>
    <div class="kv2"><span>Mã đơn</span><b id="qdCode">${esc(Don.label(o))}</b><span>${Don.PO_T[1]}</span><b id="qdPo">${poV(po)}</b><span>${Don.PO_T[2]}</span><b id="qdPo2">${poV(po2)}</b>
      <span>Trạng thái</span><span><span class="pill ${Don.PHASE_PILL[ph]}">${Don.PHASE[ph]}</span></span><span>Mẫu · xưởng</span><span>${esc(m.name)} · ${esc(X.name)} (${Don.typeLabel(o)})</span>
      <span>Số áo</span><span>${fmt(Don.orderQty(o,S))} áo</span><span>Chốt</span><span>${o.closed?Don.dm(o.closed):"—"}${o.closedBy?" · "+esc(Khung.userName(o.closedBy)):""}</span></div>
    ${full?`<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="qdAck" style="margin-top:3px"> <span>Tôi đã kiểm tra: 2 PO của đơn này đã được QLVH ký và duyệt trên ERP</span></label>`
      :`<div class="small" style="color:var(--warn)">Đơn chưa đủ 2 mã PO ERP: nhập đủ ở Chi tiết đơn trước.</div>`}
    <div class="small" id="qdMsg" style="color:var(--crit)"></div>
    <div class="acts"><a class="btn" href="don-hang.html?id=${encodeURIComponent(o.id)}#qlvh">Mở chi tiết đơn</a><button class="btn" data-qd="close">Huỷ</button>${full?`<button class="btn primary" data-qd="ok">✓ QLVH đã ký &amp; duyệt</button>`:""}</div></div>`;
  document.body.appendChild(box);
  box.addEventListener("click",async ev=>{ const b=ev.target.closest("[data-qd]"); if(ev.target===box||(b&&b.dataset.qd==="close")){ box.remove(); return; } if(!b) return;
    if(!box.querySelector("#qdAck").checked){ box.querySelector("#qdMsg").textContent="Tick xác nhận đã kiểm tra 2 PO được QLVH ký và duyệt trên ERP."; return; }
    b.disabled=true; const r=await Don.op({op:"qlvh-duyet", model:m.key, oid:o.id, po, po2, ack:true});
    if(r.status===200){ box.remove(); render(); } else { b.disabled=false; box.querySelector("#qdMsg").textContent=(r.j&&r.j.error)||"Không thực hiện được"; } });
}
/* Đợt 2: chuông chung (thanh đầu) bấm ngay tại Tổng quan → lọc tại chỗ, không tải lại trang; mở từ trang khác qua ?ex=quahan / ?ex=sap */
try { const q0=new URLSearchParams(location.search).get("ex"); if(q0&&/^[a-z0-9]+$/.test(q0)) EXF=q0; } catch(e){}
document.addEventListener("click",e=>{ const a=e.target.closest("#kbBell a[data-bell]"); if(!a) return; e.preventDefault(); EXF=a.dataset.bell; render(); const el=$("#exList"); if(el) el.closest(".panel").scrollIntoView({behavior:"smooth",block:"start"}); }, true);
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-tqgo]"); if(g){ const v=g.dataset.tqgo;
    if(v.startsWith("ex:")){ const k=v.slice(3); EXF=EXF===k?"":k; render(); const el=$("#exList"); if(el){ el.closest(".panel").scrollIntoView({behavior:"smooth",block:"start"}); } return; }
    if(v.startsWith("#")){ const el=$(v); if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("ux-flash"); setTimeout(()=>el.classList.remove("ux-flash"),1300); } return; }
    location.href=v; return; }
  if(e.target.closest("[data-tqclear]")){ EXF=""; render(); return; }
  const q=e.target.closest("[data-qlvh-view]"); if(q){ qlvhDialog(q.dataset.qlvhView); return; }
  const b=e.target.closest("[data-call]"); if(!b) return;
  const [id,d]=b.dataset.call.split("|");
  Don.mutate(id,o=>{ o.calls=o.calls||{}; o.calls[d]={...(o.calls[d]||{}), done:true, at:Don.today(), by:Khung.me&&Khung.me.id}; });
});
Don.onChange(render); Khung.onFilter(render);
window.addEventListener("storage",e=>{ if(["kehoach-sx-v3","checkhero-v3","danhmuc-v1"].includes(e.key)) render(); });
$("#menuBtn").addEventListener("click",e=>{ e.stopPropagation(); document.body.classList.toggle("nav-open"); });
render();
if(EXF&&$("#exList")) setTimeout(()=>{ const p=$("#exList").closest(".panel"); if(p) p.scrollIntoView({block:"start"}); },50);
</script>
</body>
</html>
